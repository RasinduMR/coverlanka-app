      <div class="t" id="dropText"><b>Add from a screenshot</b>Press Ctrl+V with the customer’s message screenshot, or drop the image here. Claude fills in the name, phone and address.</div>
      <button class="btn sm" id="pickImg">Choose image</button>
      <input type="file" id="imgFile" accept="image/*" style="display:none">
    </div>
    <div class="grid2">
      <div><label>Date</label><input type="date" id="f_date" value="${esc(v.date)}"></div>
      <div><label>Status</label><select id="f_status">${STATUSES.map(s=>`<option ${s===v.status?"selected":""}>${s}</option>`).join("")}</select></div>
      <div><label>Customer name *</label><input id="f_customer" value="${esc(v.customer)}"></div>
      <div><label>Delivery phone *</label><input id="f_phone" value="${esc(v.phone)}" placeholder="07XXXXXXXX"><div class="hint" id="custHint"></div></div>
      <div><label>WhatsApp number — the number they message us from</label><input id="f_whatsapp" value="${esc(v.whatsapp||"")}" placeholder="Same as delivery phone if empty"></div>
      <div class="full"><label>Address</label><textarea id="f_address" rows="2">${esc(v.address)}</textarea></div>
      <div><label>City / town</label><input id="f_city" value="${esc(v.city)}"></div>
      <div><label>District</label><select id="f_district"><option value="">—</option>${DISTRICTS.map(d=>`<option ${d===v.district?"selected":""}>${d}</option>`).join("")}</select></div>
    </div>
    <div class="grid3" style="margin-top:12px">
      <div><label>Product</label><select id="f_product">${prods.map(p=>`<option value="${p.id}" ${p.id===v.productId?"selected":""}>${esc(p.name)} — ${stockOf(p).available} left</option>`).join("")}</select></div>
      <div><label>Qty</label><input type="number" min="1" id="f_qty" value="${esc(v.qty)}"></div>
      <div><label>Unit price (Rs.)</label><input type="number" id="f_price" value="${esc(v.price)}"></div>
      <div><label>Discount (Rs.)</label><input type="number" id="f_discount" value="${esc(v.discount)}"><div class="hint" id="bulkHint"></div></div>
      <div><label>Delivery — customer pays (Rs.)</label><input type="number" id="f_delivery" value="${esc(v.delivery)}"><div class="hint" id="delHint"></div></div>
      <div><label>Courier cost — we pay (Rs.)</label><input type="number" id="f_courier" value="${esc(v.courierCost)}"></div>
      <div><label>Payment</label><select id="f_payment">${PAYMENTS.map(s=>`<option ${s===v.payment?"selected":""}>${s}</option>`).join("")}</select></div>
      <div><label>${esc(DB.settings.courier)} tracking no</label><input id="f_tracking" value="${esc(v.tracking)}"></div>
      <div><label>Notes</label><input id="f_notes" value="${esc(v.notes)}"></div>
    </div>
    <div class="totalbox" style="margin-top:14px" id="f_total"></div>
    <div id="f_warn" class="hint"></div>
    <div class="actions"><button class="btn" id="f_cancel">Cancel</button><button class="btn primary" id="f_save">${o?"Save changes":"Add order"}</button></div>`;
  openModalBg();

    date:$("#f_date").value||today(), status:$("#f_status").value, customer:$("#f_customer").value.trim(), phone:$("#f_phone").value.trim(), whatsapp:$("#f_whatsapp").value.trim(),
    address:$("#f_address").value.trim(), city:$("#f_city").value.trim(), district:$("#f_district").value, payment:$("#f_payment").value, productId:$("#f_product").value,

    if(o){ Object.assign(o,d); toast("Order "+orderNo(o)+" updated"); }
    else {
      $("#f_save").disabled=true;
      const p = product(d.productId);
      const no = await nextNumber("order");

      DB.orders.push(nord);
      if(onSaved) onSaved(nord);

// Ctrl+V with an image anywhere: open a new order (or fill the open one)
document.addEventListener("paste", e=>{
  const item=[...(e.clipboardData?e.clipboardData.items:[])].find(i=>i.type.startsWith("image/"));
  if(!item) return;
  const file=item.getAsFile(); e.preventDefault();
  if(modalKind==="order") readScreenshot(file, ()=>$("#f_customer")&&$("#f_customer").dispatchEvent(new Event("input")));
  else if(!modalKind) openOrder(null, null, file);
});

/* ================= CLAUDE: read an order screenshot ================= */
const EXTRACT_PROMPT = `This is a screenshot of a customer's order message for CoverLanka, a raincoat shop in Sri Lanka (from Facebook Messenger, WhatsApp, a comment or similar).
Extract the customer's delivery details. The text may be in Sinhala, English or Singlish.
Reply with ONLY one JSON object, no other text, with these keys:
{"name":"","phone":"","phone2":"","chat_number":"","address":"","city":"","district":"","qty":1,"notes":""}
Rules:
- name: the customer's name as given for delivery.
- phone: the delivery / contact phone number the customer typed for the parcel. phone2: a second number they typed, if any. Sri Lankan numbers in 07XXXXXXXX format (convert +94 to 0).
- chat_number: the WhatsApp number the customer is messaging FROM — usually shown at the top of a WhatsApp chat (the chat title or "~ +94 ..." beside their messages) when their number is not saved, or a number the customer says is their WhatsApp number (e.g. "WhatsApp 077..."). Format 07XXXXXXXX. "" if not visible. It may be different from phone.
- address: the full delivery address in English letters, for the courier label. Transliterate Sinhala (e.g. මාතර → Matara, පාර → Road). Do not include the city twice.
- city: the town or city, in English letters.
- district: one of the 25 districts of Sri Lanka in English (e.g. Matara, Galle, Colombo, Gampaha, Kandy, Kurunegala), worked out from the address if it is clear, else "".
- qty: how many raincoats are ordered (1 if not said).
- notes: size, colour or other special requests, else "".
- Use "" for anything that is not in the image. Never invent details.`;

async function imageToJpegBase64(file){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const max=1600; let w=img.naturalWidth, h=img.naturalHeight; const s=Math.min(1, max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
  const c=document.createElement("canvas"); c.width=w; c.height=h; const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
  URL.revokeObjectURL(url);
  const dataUrl=c.toDataURL("image/jpeg",0.88);
  return { dataUrl, base64: dataUrl.split(",")[1], mediaType:"image/jpeg" };
}
async function callClaudeRaw(content, maxTokens){
  const key=(DB.settings.claudeKey||"").replace(/\s+/g,""); const model=DB.settings.claudeModel||DEFAULT_MODEL;
  if(!key) throw new Error("NO_KEY");
  if(window.desktop && window.desktop.claude){
    const r = await window.desktop.claude({ apiKey:key, model, content, maxTokens:maxTokens||1024 });
    if(r.error) throw new Error(r.error); return r.text;
  }
  const r = await fetch("https://api.anthropic.com/v1/messages",{ method:"POST", headers:{ "x-api-key":key, "anthropic-version":"2023-06-01", "content-type":"application/json", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model, max_tokens:maxTokens||1024, messages:[{ role:"user", content }] }) });
  const j = await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
  return j.content.filter(c=>c.type==="text").map(c=>c.text).join("");
}
async function callClaude(base64, mediaType){
  if(window.__mockClaude) return window.__mockClaude(base64);
  return callClaudeRaw([{type:"image",source:{type:"base64",media_type:mediaType,data:base64}},{type:"text",text:EXTRACT_PROMPT}], 1024);
}
async function readScreenshot(file, after){
  const shot=$("#shot"), txt=$("#dropText"); if(!shot) return;
  let img;
  try{ img = await imageToJpegBase64(file); }catch(e){ txt.innerHTML="<b>Could not open that image.</b>Try another screenshot."; return; }
  shot.src=img.dataUrl; shot.style.display="block";
  txt.innerHTML=`<b><span class="spin"></span>Claude is reading the screenshot…</b>This takes a few seconds (needs internet).`;
  try{
    const text = await callClaude(img.base64, img.mediaType);
    const m = text.match(/\{[\s\S]*\}/); if(!m) throw new Error("Claude did not return the details");
    const d = JSON.parse(m[0]);
    const filled=[];
    const set=(id,val)=>{ const el=$(id); if(el && val!=null && String(val).trim()!==""){ el.value=String(val).trim(); el.classList.add("filled"); filled.push(id); } };
    set("#f_customer", d.name);
    set("#f_phone", d.phone ? (normPhone(d.phone).length===10?normPhone(d.phone):d.phone) : "");
    const cn = d.chat_number ? (normPhone(d.chat_number).length===10?normPhone(d.chat_number):d.chat_number) : "";
    if(cn && normPhone(cn)!==normPhone(d.phone)) set("#f_whatsapp", cn);
    set("#f_address", d.address);
    set("#f_city", d.city);
    if(d.district){ const match=DISTRICTS.find(x=>x.toLowerCase()===String(d.district).toLowerCase().trim()); if(match) set("#f_district", match); }
    if(num(d.qty)>1) set("#f_qty", parseInt(d.qty));
    const notes=[d.notes, (d.phone2 && normPhone(d.phone2)!==normPhone(cn))?("2nd phone: "+d.phone2):""].filter(x=>x&&String(x).trim()).join(" · ");
    if(notes) set("#f_notes", notes);
    txt.innerHTML = filled.length ? `<b>Filled ${filled.length} field(s) from the screenshot</b>Check the highlighted fields, then click “Add order”.` : `<b>No delivery details found in this image.</b>Please type them in.`;
    if(after) after();
  }catch(e){
    if(/x-api-key|authentication|401/i.test(e.message)) txt.innerHTML=`<b>The Claude key is not right.</b>Copy the key again with the “Copy key” button in the Claude Console and paste it in Settings & backup → Claude. You can still type the details.`;
    else if(/credit|billing|balance/i.test(e.message)) txt.innerHTML=`<b>No Claude API credit left.</b>Check the credit in the Claude Console. You can still type the details.`;
    else if(e.message==="NO_KEY") txt.innerHTML=`<b>Claude is not connected yet.</b>Add your Claude API key in Settings & Backup → Claude, then try again. You can still type the details.`;
    else txt.innerHTML=`<b>Claude could not read it.</b>${esc(e.message)}. Check the internet connection, or type the details.`;
  }
}

/* ================= QUOTATIONS ================= */
const QUOTE_STATUSES = ["Draft","Sent","Accepted","Declined","Expired"];
const DEFAULT_QUOTE_TERMS = "Prices are valid until the date above.\nDelivery island-wide by courier. Cash on delivery or bank transfer.\nFor large orders, 50% advance may be needed to confirm.";
function quoteNo(q){ return "QT-"+String(q.no).padStart(4,"0"); }
function quoteCalc(q){
  const items=(q.items||[]).map(it=>({ ...it, line: num(it.qty)*num(it.price) }));
  const subtotal=items.reduce((a,it)=>a+it.line,0);
  const total=subtotal-num(q.bulk)-num(q.discount)+num(q.delivery);
  const qty=items.reduce((a,it)=>a+num(it.qty),0);
  return { items, subtotal, total, qty };
}
function quoteStatus(q){ return (q.status!=="Accepted" && q.status!=="Declined" && q.validUntil && q.validUntil<today()) ? "Expired" : q.status; }
function addDays(d,n){ const t=new Date(d); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); }

function renderQuotes(){
  const list=[...(DB.quotes||[])].sort((a,b)=>b.no-a.no);
  const open=list.filter(q=>["Draft","Sent"].includes(quoteStatus(q)));
  const won=list.filter(q=>q.status==="Accepted");
  $("#main").innerHTML=`
    <div class="row"><div><h1>Quotations</h1><p class="sub" style="margin:0">Price quotes for bulk or special orders — save as PDF, send on WhatsApp, and turn into an order when accepted.</p></div>
      <div class="spacer"></div><button class="btn primary" id="qNew">+ New quotation</button></div>
    <div class="cards" style="margin-top:20px">
      <div class="card or"><div class="k">Open quotations</div><div class="v">${open.length}</div><div class="s">worth ${money(open.reduce((a,q)=>a+quoteCalc(q).total,0))}</div></div>
      <div class="card"><div class="k">Accepted</div><div class="v">${won.length}</div><div class="s">${list.length?Math.round(won.length/list.length*100):0}% of all quotes</div></div>
      <div class="card"><div class="k">All quotations</div><div class="v">${list.length}</div></div>
    </div>
    <div class="panel">${list.length?`<div class="tablewrap"><table><thead><tr><th>Quotation</th><th>Customer</th><th class="num">Items</th><th class="num">Total</th><th>Valid until</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(q=>{ const c=quoteCalc(q), st=quoteStatus(q); return `<tr>
        <td style="white-space:nowrap"><b>${quoteNo(q)}</b><div class="cell2">${esc(q.date)}</div></td>
        <td><span class="cell1">${esc(q.customer)}</span><div class="cell2">${esc(q.company||q.phone||"")}</div></td>
        <td class="num">${c.qty}</td><td class="num">${money(c.total)}</td>
        <td style="white-space:nowrap">${esc(q.validUntil||"—")}</td>
        <td><select class="status q-${st}" data-qst="${q.id}">${QUOTE_STATUSES.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select>${q.orderId?`<div class="cell2">→ ${esc(orderNo(DB.orders.find(o=>o.id===q.orderId)||{no:0}))}</div>`:""}</td>
        <td class="actions-cell">
          <button class="btn sm" data-qpdf="${q.id}">PDF</button>
          <button class="btn sm wa" data-qwa="${q.id}" title="Send on WhatsApp">${ICON_WA}<span class="wa-t">WhatsApp</span></button>
          <button class="btn sm" data-qedit="${q.id}">Edit</button>
          <button class="btn sm more" data-qmore="${q.id}" aria-label="More actions">${ICON_MORE}</button>
        </td></tr>`; }).join("")}
    </tbody></table></div>`:`<div class="empty"><b>No quotations yet</b>When a customer asks for a price (for example 50 raincoats for a school or a company), click “+ New quotation”.</div>`}</div>`;
  $("#qNew").onclick=()=>openQuote();
  document.querySelectorAll("[data-qedit]").forEach(b=>b.onclick=()=>openQuote(b.dataset.qedit));
  document.querySelectorAll("[data-qpdf]").forEach(b=>b.onclick=()=>quotePDF(b.dataset.qpdf));
  document.querySelectorAll("[data-qwa]").forEach(b=>b.onclick=()=>quoteWhatsApp(b.dataset.qwa));
  document.querySelectorAll("[data-qst]").forEach(s=>s.onchange=e=>{ const q=DB.quotes.find(x=>x.id===s.dataset.qst); q.status=e.target.value; if(q.status==="Expired") q.validUntil=q.validUntil||today(); if(q.status!=="Expired" && q.validUntil<today() && q.status!=="Accepted" && q.status!=="Declined") q.validUntil=addDays(today(),7); saveDB(); toast(quoteNo(q)+" → "+q.status); render(); });
  document.querySelectorAll("[data-qmore]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const id=b.dataset.qmore; const q=DB.quotes.find(x=>x.id===id);
    popMenu(b, `${q.orderId?"":`<button data-a="order" style="color:var(--brand-ink);font-weight:700">Accepted — make it an order</button>`}<button data-a="dup">Duplicate</button><button data-a="del" style="color:var(--red)">Delete quotation</button>`, a=>{
      if(a==="order") quoteToOrder(id);
      if(a==="dup"){ (async()=>{ const c=JSON.parse(JSON.stringify(q)); Object.assign(c,{id:uid(),no:await nextNumber("quote"),date:today(),validUntil:addDays(today(),14),status:"Draft",orderId:null}); DB.quotes.push(c); saveDB(); toast("Copied as "+quoteNo(c)); render(); })(); }
      if(a==="del" && confirm("Delete quotation "+quoteNo(q)+"? It goes to the Trash for 30 days.")){ trashIt("quotes",id); }
    }); });
}

function openQuote(id){
  const q = id ? DB.quotes.find(x=>x.id===id) : null;
  const p0 = DB.products.find(p=>p.active!==false) || DB.products[0] || {};
  const v = q ? JSON.parse(JSON.stringify(q)) : { date:today(), validUntil:addDays(today(),14), customer:"", company:"", phone:"", address:"", discount:0, delivery:0, status:"Draft",
    items:[{ productId:p0.id||"", desc:p0.name||"Raincoat", qty:10, price:num(p0.price) }], terms:DEFAULT_QUOTE_TERMS, note:"" };
  modalKind="quote";
  $("#modal").innerHTML=`<h2>${q?"Edit quotation "+quoteNo(q):"New quotation"}</h2>
    <div class="grid3">
      <div><label for="q_date">Date</label><input type="date" id="q_date" value="${esc(v.date)}"></div>
      <div><label for="q_valid">Valid until</label><input type="date" id="q_valid" value="${esc(v.validUntil)}"></div>
      <div><label for="q_status">Status</label><select id="q_status">${QUOTE_STATUSES.map(s=>`<option ${s===v.status?"selected":""}>${s}</option>`).join("")}</select></div>
      <div><label for="q_customer">Customer name *</label><input id="q_customer" value="${esc(v.customer)}"></div>
      <div><label for="q_company">Company / school (optional)</label><input id="q_company" value="${esc(v.company)}"></div>
      <div><label for="q_phone">Phone</label><input id="q_phone" value="${esc(v.phone)}" placeholder="07XXXXXXXX"></div>
      <div class="full"><label for="q_address">Address</label><input id="q_address" value="${esc(v.address)}"></div>
    </div>
    <label style="margin-top:18px">Items</label>
    <div class="tablewrap"><table id="q_items"><thead><tr><th style="width:45%">Description</th><th class="num">Qty</th><th class="num">Unit price (Rs.)</th><th class="num">Amount</th><th></th></tr></thead><tbody></tbody></table></div>
    <div class="row" style="margin-top:8px"><button class="btn sm" id="q_add">+ Add item</button>
      <span class="hint" style="margin:0" id="q_tierhint"></span></div>
    <div class="grid3" style="margin-top:14px">
      <div><label for="q_bulk">Bulk discount</label><input id="q_bulk" readonly tabindex="-1" style="background:var(--panel-2)">
        <label style="display:flex;gap:7px;align-items:center;margin-top:7px;font-weight:600;color:var(--ink-2)"><input type="checkbox" id="q_bulkon" style="width:auto" ${v.bulkAuto===false?"":"checked"}> Apply bulk discount</label></div>
      <div><label for="q_del">Delivery charge (Rs.)</label><input type="number" id="q_del" value="${esc(v.delivery)}">
        <label style="display:flex;gap:7px;align-items:center;margin-top:7px;font-weight:600;color:var(--ink-2)"><input type="checkbox" id="q_delauto" style="width:auto" ${v.deliveryAuto===false?"":"checked"}> Work out by weight <span class="muted" id="q_kg" style="font-weight:500"></span></label></div>
      <div><label for="q_disc">Extra discount (Rs.)</label><input type="number" id="q_disc" value="${esc(v.discount)}"></div>
      <div class="full"><label for="q_note">Message to the customer (shown on the quotation)</label><input id="q_note" value="${esc(v.note)}" placeholder="e.g. Thank you for your interest in CoverLanka raincoats."></div>
      <div class="full"><label for="q_terms">Terms</label><textarea id="q_terms" rows="3">${esc(v.terms)}</textarea></div>
    </div>
    <div class="totalbox" style="margin-top:14px" id="q_total"></div>
    <div class="actions">${q?"":`<span class="hint" style="margin:0 auto 0 0">You can save it as a PDF from the list after saving.</span>`}<button class="btn" id="q_cancel">Cancel</button><button class="btn primary" id="q_save">${q?"Save changes":"Save quotation"}</button></div>`;
  openModalBg();
  const items=v.items;
  const drawItems=()=>{
    $("#q_items tbody").innerHTML=items.map((it,i)=>`<tr>
      <td><input data-f="desc" data-i="${i}" value="${esc(it.desc)}" list="q_prod_list"></td>
      <td class="num"><input type="number" min="1" data-f="qty" data-i="${i}" value="${esc(it.qty)}" style="width:80px;text-align:right"></td>
      <td class="num"><input type="number" data-f="price" data-i="${i}" value="${esc(it.price)}" style="width:120px;text-align:right"></td>
      <td class="num" id="q_line${i}">${money(num(it.qty)*num(it.price))}</td>
      <td>${items.length>1?`<button class="btn sm danger" data-rm="${i}" aria-label="Remove item">✕</button>`:""}</td></tr>`).join("")+
      `<datalist id="q_prod_list">${DB.products.map(p=>`<option value="${esc(p.name)}">`).join("")}</datalist>`;
    $("#q_items").querySelectorAll("input").forEach(el=>el.oninput=()=>{ const it=items[+el.dataset.i]; it[el.dataset.f]= el.dataset.f==="desc"?el.value:num(el.value);
      if(el.dataset.f==="desc"){ const p=DB.products.find(x=>x.name===el.value); if(p){ it.productId=p.id; } else it.productId=""; }
      $("#q_line"+el.dataset.i).textContent=money(num(it.qty)*num(it.price)); upd(); });
    $("#q_items").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ items.splice(+b.dataset.rm,1); drawItems(); upd(); });
  };
  const read=()=>({ date:$("#q_date").value||today(), validUntil:$("#q_valid").value, status:$("#q_status").value, customer:$("#q_customer").value.trim(), company:$("#q_company").value.trim(),
    phone:$("#q_phone").value.trim(), address:$("#q_address").value.trim(), discount:num($("#q_disc").value), delivery:num($("#q_del").value),
    bulkAuto:$("#q_bulkon").checked, deliveryAuto:$("#q_delauto").checked, bulk:0, bulkOff:0, bulkQty:0,
    note:$("#q_note").value.trim(), terms:$("#q_terms").value.trim(), items:items.filter(it=>String(it.desc).trim()&&num(it.qty)>0) });
  const applyRules=(d)=>{
    const coatQty=d.items.filter(it=>it.productId).reduce((a,it)=>a+num(it.qty),0);
    const off=bulkOffPerUnit(coatQty);
    d.bulkQty=coatQty; d.bulkOff=d.bulkAuto?off:0; d.bulk=d.bulkAuto?off*coatQty:0;
    const kg=itemsWeight(d.items);
    if(d.deliveryAuto){ d.delivery=deliveryCharge(kg); $("#q_del").value=d.delivery; }
    $("#q_del").readOnly=d.deliveryAuto; $("#q_del").style.background=d.deliveryAuto?"var(--panel-2)":"";
    $("#q_kg").textContent=kg?`(${kg} kg)`:"";
    $("#q_bulk").value = d.bulk ? `${money(d.bulk)}  (${money(off)} × ${coatQty})` : (off&&!d.bulkAuto?"Off":"None");
    const T=[...(pricing().tiers||[])].filter(t=>num(t.min)>0).sort((a,b)=>num(a.min)-num(b.min));
    $("#q_tierhint").textContent = T.length ? "Bulk discount: "+T.map(t=>`${t.min}+ raincoats → ${money(t.off)} off each`).join(" · ") : "";
    return d;
  };
  const upd=()=>{ const d=applyRules(read()), c=quoteCalc(d);
    const cost=c.items.reduce((a,it)=>{ const p=it.productId?product(it.productId):null; return a+(p?num(p.cost)*num(it.qty):0); },0);
    const courier=courierCharge(itemsWeight(d.items));
    $("#q_total").innerHTML=`<span>Raincoats: <b>${d.bulkQty}</b></span><span>Total for customer: <b>${money(c.total)}</b></span>${cost?`<span>Profit after courier (${money(courier)}): <b>${money(c.total-cost-courier)}</b></span>`:""}`; };
  drawItems(); upd();
  ["#q_disc","#q_del"].forEach(s=>$(s).oninput=upd);
  ["#q_bulkon","#q_delauto"].forEach(s=>$(s).onchange=upd);
  $("#q_add").onclick=()=>{ items.push({productId:"",desc:"",qty:1,price:0}); drawItems(); upd(); const ins=$("#q_items").querySelectorAll('input[data-f="desc"]'); ins[ins.length-1].focus(); };
  $("#q_cancel").onclick=closeModal;
  $("#q_save").onclick=async ()=>{
    const d=applyRules(read());
    if(!d.customer){ alert("Please enter the customer name."); return; }
    if(!d.items.length){ alert("Add at least one item."); return; }
    let nq=null;
    if(q) Object.assign(q,d); else { $("#q_save").disabled=true; DB.quotes=DB.quotes||[]; nq={ id:uid(), no:await nextNumber("quote"), created:new Date().toISOString(), ...d }; DB.quotes.push(nq); }
    saveDB(); closeModal(); toast(q?"Quotation saved":"Quotation "+quoteNo(nq)+" saved"); render();
  };
  setTimeout(()=>$("#q_customer").focus(),60);
}

function quotePDF(id){
  const q=DB.quotes.find(x=>x.id===id); if(!q) return;
  $("#printArea").innerHTML=quoteHTML(q);
  const imgs=[...$("#printArea").querySelectorAll("img")];
  Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;}))).then(()=>setTimeout(async ()=>{
    if(window.desktop && window.desktop.savePDF){ const r=await window.desktop.savePDF("CoverLanka "+quoteNo(q)+" "+(q.company||q.customer).replace(/[\\/:*?"<>|]/g,"")+".pdf"); if(r&&r.saved){ if(q.status==="Draft"){ q.status="Sent"; saveDB(); render(); } toast("Saved: "+r.path); } }
    else window.print();
  },80));
}
function quoteWhatsApp(id){
  const q=DB.quotes.find(x=>x.id===id); if(!q) return;
  const w=waNumber(q.phone); if(w.length<11){ toast("Add the customer's phone number to this quotation first"); openQuote(id); return; }
  const c=quoteCalc(q);
  const lines=c.items.map(it=>`• ${it.desc} × ${num(it.qty)} — රු. ${Math.round(num(it.price)).toLocaleString("en-US")} බැගින් = රු. ${Math.round(it.line).toLocaleString("en-US")}`).join("\n");
  const text=`ආයුබෝවන් ${firstName(q.customer)} 😊\n${DB.settings.businessName} වෙතින් ඔබ ඉල්ලූ quotation එක (${quoteNo(q)}):\n\n${lines}`+
    (num(q.bulk)?`\nBulk discount (රු. ${Math.round(num(q.bulkOff))} × ${num(q.bulkQty)}): -රු. ${Math.round(num(q.bulk)).toLocaleString("en-US")}`:"")+
    (num(q.discount)?`\nDiscount: -රු. ${Math.round(num(q.discount)).toLocaleString("en-US")}`:"")+(num(q.delivery)?`\nDelivery: රු. ${Math.round(num(q.delivery)).toLocaleString("en-US")}`:"")+
    `\n\nමුළු මුදල: රු. ${Math.round(c.total).toLocaleString("en-US")}\n${q.validUntil?`මෙම මිල ${q.validUntil} දක්වා වලංගුයි.\n`:""}Order එක confirm කරන්න මෙම chat එකට reply කරන්න. ස්තූතියි! 🙏`;
  const url="https://wa.me/"+w+"?text="+encodeURIComponent(text);
  if(window.desktop && window.desktop.openExternal) window.desktop.openExternal(url); else window.open(url,"_blank");
  if(q.status==="Draft"){ q.status="Sent"; saveDB(); render(); }
  toast("WhatsApp opening — attach the PDF too if you saved one");
}
function quoteToOrder(id){
  const q=DB.quotes.find(x=>x.id===id); if(!q) return;
  const c=quoteCalc(q);
  const main=c.items.find(it=>it.productId) || c.items[0];
  const pid=(main&&main.productId) || (DB.products[0]||{}).id;
  const extra=c.items.filter(it=>it!==main);
  // one order for the main item; other lines go into notes and the price difference into discount so the total matches
  const qty=num(main.qty)||1;
  const otherTotal=extra.reduce((a,it)=>a+it.line,0);
  const price=Math.round((num(main.price)+otherTotal/qty)*100)/100; // extra lines are spread into the unit price so the total matches
  openOrder(null, { customer:q.customer, phone:q.phone, address:q.address, productId:pid, qty, price, discount:num(q.discount)+num(q.bulk), delivery:num(q.delivery), courierCost:courierCharge(itemsWeight(c.items)),
    status:"Confirmed", notes:[quoteNo(q), q.company, extra.length?("Also: "+extra.map(it=>it.desc+" × "+num(it.qty)).join(", ")):""].filter(Boolean).join(" · ") }, null,
    (ord)=>{ q.status="Accepted"; q.orderId=ord.id; saveDB(); });
  toast("Check the details, then click “Add order”");
}

function openProduct(id){
  const p = id ? product(id) : null;
  const v = p || { code:"RC-"+String(DB.products.length+1).padStart(3,"0"), name:"", cost:1800, price:2900, reorder:5, active:true };

/* ================= CLAUDE WEEKLY SUMMARY ================= */
function weekStats(){
  const t=new Date(today()); const iso=d=>d.toISOString().slice(0,10);
  const d7=iso(new Date(t-6*86400000)), d14=iso(new Date(t-13*86400000));
  const pick=(a,b)=>DB.orders.filter(o=>(o.date||"")>=a && (o.date||"")<=b);
  const sumUp=list=>{ const del=list.filter(o=>o.status==="Delivered"); return {
    orders:list.filter(o=>o.status!=="Cancelled").length, delivered:del.length, returned:list.filter(o=>o.status==="Returned").length,
    cancelled:list.filter(o=>o.status==="Cancelled").length, raincoats:list.filter(countsTowardStock).reduce((a,o)=>a+(num(o.qty)||1),0),
    salesDelivered:Math.round(del.reduce((a,o)=>a+orderCalc(o).total,0)) }; };
  const thisW=pick(d7,today()), lastW=pick(d14,iso(new Date(t-7*86400000)));
  const dist={}; thisW.forEach(o=>{ const k=o.district||o.city||"unknown"; dist[k]=(dist[k]||0)+1; });
  const exp7=DB.expenses.filter(e=>(e.date||"")>=d7).reduce((a,e)=>a+num(e.amount),0);
  const ads7=DB.expenses.filter(e=>(e.date||"")>=d7 && e.category==="Facebook Ads").reduce((a,e)=>a+num(e.amount),0);
  const M=businessMoney(); const run=stockRunway();
  return { today:today(), thisWeek:sumUp(thisW), lastWeek:sumUp(lastW), districtsThisWeek:dist, expensesThisWeek:exp7, facebookAdsThisWeek:ads7,
    stockInHand:run.avail, avgRaincoatsSoldPerDay14d:+run.perDay.toFixed(2), stockDaysLeft:run.days,
    ordersNeedingAttention:reminders().length, pendingOrders:DB.orders.filter(o=>["New","Confirmed","Dispatched"].includes(o.status)).length,
    allTime:{ capital:M.capital, cashBalance:Math.round(M.cash), profitSoFar:Math.round(M.netProfit), businessValue:Math.round(M.worth) },
    pricing:{ sellingPrice:num((DB.products[0]||{}).price), costPrice:num((DB.products[0]||{}).cost), deliveryFirstKg:num(pricing().firstKg), deliveryPerExtraKg:num(pricing().extraKg), bulkDiscountTiers:pricing().tiers } };
}
async function weeklySummary(){
  const box=$("#sumText"), btn=$("#dSum");
  if(!(DB.settings.claudeKey||"").trim() && !window.__mockSummary){ box.className="empty"; box.innerHTML="<b>Claude is not connected</b>Add the API key in Settings & backup → Claude."; return; }
  btn.disabled=true; box.className="summary"; box.innerHTML='<span class="spin"></span>Claude is reading this week’s numbers…';
  const prompt=`You are helping the owners of CoverLanka, a small raincoat business in Sri Lanka (4 student partners, sells on Facebook, cash on delivery via Domex).
Here are this week's numbers as JSON (money in LKR):
${JSON.stringify(weekStats(),null,1)}

Write a short weekly summary in simple, friendly spoken Sinhala (Sinhala script; English words like order, stock, ad, COD are fine as Sri Lankans say them).
Format: 4-6 short lines starting with "• " covering how the week went vs last week, stock, money, and anything that needs attention; then a line "මේ සතියට කරන්න:" followed by 2-3 short practical suggestions starting with "→ ".
Use only the numbers given. Do not invent facts. If there is little data, say so briefly. Under 170 words. No heading, no markdown bold.`;
  try{

}

  const sales=del.reduce((a,o)=>a+orderCalc(o).total,0), pcost=del.reduce((a,o)=>a+orderCalc(o).productCost,0);
  const courier=[...del,...ret].reduce((a,o)=>a+num(o.courierCost),0);
  const exList=DB.expenses.filter(e=>inM(e.date)); const exps=exList.reduce((a,e)=>a+num(e.amount),0);
  const net=sales-pcost-courier-exps; const sold=orders.filter(countsTowardStock).reduce((a,o)=>a+(num(o.qty)||1),0);
  const cats={}; exList.forEach(e=>cats[e.category]=(cats[e.category]||0)+num(e.amount));
  const dist={}; orders.filter(o=>o.status!=="Cancelled").forEach(o=>{ const k=o.district||o.city||"Not set"; dist[k]=(dist[k]||0)+1; });
  const M=businessMoney(); const P=DB.partners||[]; const cap=M.capital||1;

    <div class="kp">

      <tr><td>Sales from delivered orders (incl. delivery charge)</td><td class="n">${money(sales)}</td></tr>
      <tr><td>Product cost</td><td class="n">-${money(pcost)}</td></tr>
      <tr><td>Courier cost (delivered + returned)</td><td class="n">-${money(courier)}</td></tr>
      <tr><td>Other expenses</td><td class="n">-${money(exps)}</td></tr>
      <tr><td><b>Net profit</b></td><td class="n"><b>${money(net)}</b></td></tr></table>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
      <div><h2>Orders by status</h2><table>${byStatus.map(([s,n])=>`<tr><td>${s}</td><td class="n">${n}</td></tr>`).join("")||"<tr><td>No orders</td></tr>"}</table></div>
      <div><h2>Expenses by category</h2><table>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td>${esc(c)}</td><td class="n">${money(v)}</td></tr>`).join("")||"<tr><td>No expenses</td></tr>"}</table></div>
    </div>
    <h2>Where orders came from</h2><table>${Object.entries(dist).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join("")||"<tr><td>No orders</td></tr>"}</table>
    <h2>Partners</h2><table><tr><th>Partner</th><th class="n">Invested</th><th class="n">Share</th><th class="n">Share of this month’s profit</th><th class="n">Share of profit so far</th><th class="n">Share of business value</th></tr>
      ${P.map(p=>{const sh=num(p.amount)/cap;return `<tr><td>${esc(p.name)}</td><td class="n">${money(p.amount)}</td><td class="n">${Math.round(sh*1000)/10}%</td><td class="n">${money(net*sh)}</td><td class="n">${money(M.netProfit*sh)}</td><td class="n">${money(M.worth*sh)}</td></tr>`}).join("")}</table>
    <h2>Business position today</h2><table>
      <tr><td>Capital invested</td><td class="n">${money(M.capital)}</td></tr><tr><td>Cash balance (estimated)</td><td class="n">${money(M.cash)}</td></tr>
      <tr><td>Stock in hand (${DB.products.reduce((a,p)=>a+Math.max(0,stockOf(p).available),0)} items, at cost)</td><td class="n">${money(M.stockValue)}</td></tr>
      <tr><td><b>Business value</b></td><td class="n"><b>${money(M.worth)}</b></td></tr><tr><td>Total profit so far</td><td class="n">${money(M.netProfit)}</td></tr></table>
  </div>`;
  $("#printArea").innerHTML=html;
  const imgs=[...$("#printArea").querySelectorAll("img")];
  Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;}))).then(()=>setTimeout(async ()=>{
    if(window.desktop && window.desktop.savePDF){ const r=await window.desktop.savePDF("CoverLanka report "+ym+".pdf"); if(r&&r.saved) toast("Report saved: "+r.path); }
    else window.print();
  },80));
}

/* ================= PIN LOCK ================= */
async function sha(text){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function showLock(){
  if(!DB.settings.pinHash) return;
  closeModal(); $("#lock").classList.add("on"); $("#lockPin").value=""; $("#lockMsg").textContent=""; setTimeout(()=>$("#lockPin").focus(),50);
}
async function tryUnlock(){
  const v=$("#lockPin").value.trim();
  if(await sha(DB.settings.pinSalt+v)===DB.settings.pinHash){ $("#lock").classList.remove("on"); return; }
  $("#lockMsg").textContent="Wrong PIN. Try again."; const c=$("#lock .card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); $("#lockPin").select();
}
$("#lockGo").onclick=tryUnlock;
$("#lockPin").addEventListener("keydown",e=>{ if(e.key==="Enter") tryUnlock(); });
$("#lockForgot").onclick=async e=>{ e.preventDefault();
  const code=prompt("Enter the recovery code you wrote down when you set the PIN:"); if(!code) return;
  if(await sha(DB.settings.pinSalt+code.trim().toUpperCase())===DB.settings.recoveryHash){ delete DB.settings.pinHash; delete DB.settings.recoveryHash; saveDB(); $("#lock").classList.remove("on"); toast("PIN removed. Set a new one in Settings."); render(); }
  else $("#lockMsg").textContent="That recovery code is not right.";
};
async function setPin(pin){
  const salt=uid()+uid(); const rc=Array.from(crypto.getRandomValues(new Uint8Array(5))).map(x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join("")+"-"+Array.from(crypto.getRandomValues(new Uint8Array(5))).map(x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join("");
  DB.settings.pinSalt=salt; DB.settings.pinHash=await sha(salt+pin); DB.settings.recoveryHash=await sha(salt+rc); saveDB();
  return rc;
}

  let tiers=JSON.parse(JSON.stringify(pricing().tiers||[]));
  const example=()=>{ const P={firstKg:num($("#pr_f").value),extraKg:num($("#pr_e").value)}; const ex=[1,2,5,10].map(n=>`${n} → ${money(byWeight(n*num((DB.products[0]||{}).weightKg||1),P.firstKg,P.extraKg))}`).join(" · ");
    $("#pr_example").textContent="Delivery examples (raincoats → customer pays): "+ex; };
  const drawTiers=()=>{ $("#tierList").innerHTML=tiers.map((t,i)=>`<div class="row" style="margin-top:8px;gap:8px">
      <span>When buying</span><input type="number" min="1" data-tm="${i}" value="${esc(t.min)}" style="width:80px"><span>or more raincoats —</span>
      <input type="number" data-to="${i}" value="${esc(t.off)}" style="width:100px"><span>Rs. off each</span>
      <button class="btn sm danger" data-td="${i}" aria-label="Remove level">✕</button></div>`).join("") || '<p class="muted">No bulk discount.</p>';
    document.querySelectorAll("[data-tm]").forEach(el=>el.oninput=()=>tiers[+el.dataset.tm].min=num(el.value));
    document.querySelectorAll("[data-to]").forEach(el=>el.oninput=()=>tiers[+el.dataset.to].off=num(el.value));
    document.querySelectorAll("[data-td]").forEach(el=>el.onclick=()=>{ tiers.splice(+el.dataset.td,1); drawTiers(); }); };
  drawTiers(); example(); ["#pr_f","#pr_e"].forEach(id=>$(id).oninput=example);
  $("#tier_add").onclick=()=>{ tiers.push({min:20,off:400}); drawTiers(); };
  $("#pr_save").onclick=()=>{ S.pricing={ firstKg:num($("#pr_f").value), extraKg:num($("#pr_e").value), courierFirstKg:num($("#pr_cf").value), courierExtraKg:num($("#pr_ce").value),
      tiers:tiers.filter(t=>num(t.min)>0&&num(t.off)>0).sort((a,b)=>a.min-b.min) }; saveDB(); toast("Prices saved"); render(); };
  $("#s_keysave").onclick=()=>{ S.claudeKey=$("#s_key").value.replace(/\s+/g,""); S.claudeModel=$("#s_model").value; saveDB(); $("#s_keymsg").textContent=S.claudeKey?"Key saved":"Not connected"; toast("Claude settings saved"); };

  // WhatsApp templates
  let wa = JSON.parse(JSON.stringify(S.wa||DEFAULT_WA));
  const drawWa=()=>{ $("#waList").innerHTML = wa.map((t,i)=>`<div class="wa-row">
      <input class="wa-name" data-wn="${i}" value="${esc(t.name)}" aria-label="Message name"><textarea class="wa-text" data-wt="${i}" rows="4" aria-label="Message text">${esc(t.text)}</textarea>
      <button class="btn sm danger wa-del" data-wd="${i}">Remove</button></div>`).join("");
    document.querySelectorAll("[data-wn]").forEach(el=>el.oninput=()=>wa[+el.dataset.wn].name=el.value);
    document.querySelectorAll("[data-wt]").forEach(el=>el.oninput=()=>wa[+el.dataset.wt].text=el.value);
    document.querySelectorAll("[data-wd]").forEach(el=>el.onclick=()=>{ wa.splice(+el.dataset.wd,1); drawWa(); }); };
  drawWa();
  $("#wa_add").onclick=()=>{ wa.push({name:"New message",text:"ආයුබෝවන් {name},\n"}); drawWa(); };
  $("#wa_reset").onclick=()=>{ wa=JSON.parse(JSON.stringify(DEFAULT_WA)); drawWa(); };
  $("#wa_save").onclick=()=>{ S.wa=wa.filter(t=>t.name.trim()&&t.text.trim()); saveDB(); toast("WhatsApp messages saved"); };

  // PIN
  const pinMsg=(html)=>$("#pin_msg").innerHTML=html;
  if($("#pin_set")) $("#pin_set").onclick=async ()=>{
    const a=$("#pin1").value.trim(), b=$("#pin2").value.trim();
    if(!/^\d{4,6}$/.test(a)){ pinMsg('<p class="hint" style="color:var(--red)">Use 4 to 6 numbers.</p>'); return; }
    if(a!==b){ pinMsg('<p class="hint" style="color:var(--red)">The two PINs are different.</p>'); return; }
    const rc=await setPin(a); renderNavTools();
    $("#main").querySelector("#pin_msg").closest(".panel").innerHTML=`<h3>App lock</h3><div class="alert" style="margin:0"><b>PIN is set.</b> Write this recovery code somewhere safe — it is the only way in if the PIN is forgotten:<div style="font-family:Outfit,sans-serif;font-size:26px;letter-spacing:3px;margin:8px 0;color:var(--ink)">${rc}</div>It will not be shown again.</div><div class="actions" style="justify-content:flex-start"><button class="btn primary" id="pin_ok">I wrote it down</button></div>`;
    $("#pin_ok").onclick=()=>render();
  };
  if($("#pin_off")) $("#pin_off").onclick=()=>{ if(confirm("Turn off the PIN? Anyone using this laptop will be able to open the app.")){ delete S.pinHash; delete S.recoveryHash; saveDB(); toast("PIN turned off"); render(); } };
  if($("#pin_change")) $("#pin_change").onclick=()=>{ delete S.pinHash; delete S.recoveryHash; saveDB(); render(); setTimeout(()=>$("#pin1")&&$("#pin1").focus(),50); };

  // Notifications
  (async()=>{
    const box=$("#np_state"); if(!box) return;
    const sub=await currentSubscription().catch(()=>null);
    const on = !!sub && (DB.devices||[]).some(d=>d.endpoint===sub.endpoint);
    if(!$("#np_state")) return;
    if(!pushSupported()) box.innerHTML = isIOS()&&!isStandalone()
      ? `<div class="alert" style="margin:0"><b>First add the app to the Home Screen.</b> In Safari press <b>Share</b> → <b>Add to Home Screen</b>, open CoverLanka from the Home Screen, and come back here.</div>`
      : `<div class="alert" style="margin:0">This browser can't show notifications.</div>`;
    else if(on) box.innerHTML=`<div class="row"><span class="np-on">On for this device</span><div class="spacer"></div><button class="btn" id="np_test">Send a test</button><button class="btn danger" id="np_off">Turn off</button></div>`;
    else box.innerHTML=`<div class="row"><span class="muted" style="font-weight:600">Off on this device</span><div class="spacer"></div><button class="btn primary" id="np_on">Turn on notifications</button></div>`;
    if($("#np_on")) $("#np_on").onclick=async()=>{ const b=$("#np_on"); b.disabled=true; b.innerHTML='<span class="spin"></span>Turning on…';
      try{ await enableNotifications(); toast("Notifications are on for this device"); render(); }catch(e){ b.disabled=false; b.textContent="Turn on notifications"; alert(e.message); } };
    if($("#np_off")) $("#np_off").onclick=async()=>{ await disableNotifications(); toast("Notifications turned off"); render(); };
    if($("#np_test")) $("#np_test").onclick=async()=>{ const b=$("#np_test"); b.disabled=true; b.innerHTML='<span class="spin"></span>Sending…';
      try{ const r=await sendPush({title:"CoverLanka test", body:"Notifications are working 🎉", tag:"test", url:"./"}, true); toast(r.sent?("Sent to "+r.sent+" device"+(r.sent>1?"s":"")):"Could not reach the devices"); }
      catch(e){ alert("Could not send: "+e.message); } b.disabled=false; b.textContent="Send a test"; };
  })();
  document.querySelectorAll("[data-devx]").forEach(b=>b.onclick=async()=>{ const d=DB.devices.find(x=>x.id===b.dataset.devx); if(!d||!confirm("Stop notifications on "+d.name+"?")) return;
    if(d.id===myDeviceId()) await disableNotifications(); else { DB.devices=DB.devices.filter(x=>x.id!==d.id); saveDB(); } render(); });
  $("#np_orders").onchange=e=>{ S.notifyNewOrders=e.target.checked; saveDB(); toast(e.target.checked?"New-order notifications on":"New-order notifications off"); };
  // Google Drive backup
  if($("#dr_now")) $("#dr_now").onclick=async ()=>{ const b=$("#dr_now"); b.disabled=true; b.innerHTML='<span class="spin"></span>Backing up…';
    try{ await driveBackup("manual"); toast("Backed up to Google Drive"); }catch(e){ alert("Backup failed: "+e.message); } render(); };
  if($("#dr_restore")) $("#dr_restore").onclick=openDriveRestore;
  // Trash
  document.querySelectorAll("[data-trr]").forEach(b=>b.onclick=()=>{ if(restoreFromTrash(b.dataset.trr)){ toast("Brought back"); render(); } });
  document.querySelectorAll("[data-trx]").forEach(b=>b.onclick=()=>{ const t=DB.trash.find(x=>x.id===b.dataset.trx); if(t&&confirm("Delete “"+t.label+"” forever? This cannot be undone.")){ DB.trash=DB.trash.filter(x=>x.id!==t.id); saveDB(); render(); } });
  if($("#tr_empty")) $("#tr_empty").onclick=()=>{ if(confirm("Delete everything in the Trash forever? This cannot be undone.")){ DB.trash=[]; saveDB(); toast("Trash emptied"); render(); } };

  $("#b_exp").onclick=()=>{ const copy=JSON.parse(JSON.stringify(DB)); copy.settings.claudeKey=""; delete copy.devices; download("coverlanka-backup-"+today()+".json", JSON.stringify(copy,null,1), "application/json"); };
  $("#b_imp").onclick=()=>$("#b_file").click();
  $("#b_file").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{
      try{ const d=JSON.parse(r.result); if(!d.orders||!d.products) throw new Error("This is not a CoverLanka backup file");
        if(confirm("Replace ALL online data (for everyone) with this backup ("+d.orders.length+" orders)?\nA copy of the data as it is now is saved first.")){ const key=DB.settings.claudeKey; if(!d.settings) d.settings={}; if(!d.settings.claudeKey) d.settings.claudeKey=key; safetyBackup("before-restore").then(()=>uploadAll(d)); } }
      catch(err){ alert("Could not read the backup: "+err.message); }
    }; r.readAsText(f);
  };
  $("#b_csv").onclick=exportOrdersCSV;
  $("#b_ccsv").onclick=exportCustomersCSV;
  $("#b_reset").onclick=()=>{
    if(confirm("This deletes every order, product, stock entry, expense and partner, for everyone.\nA backup copy is saved first.\n\nDelete everything?") && confirm("Are you really sure?")){
      safetyBackup("before-delete-all").then(where=>{ const d=defaultData(); d.settings.claudeKey=DB.settings.claudeKey; uploadAll(d); toast(where==="drive"?"All data deleted — a copy is in Google Drive":"All data deleted — a backup file was downloaded"); });
    }
  };
}
function download(name, text, type){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
const csvq=v=>{ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
function exportOrdersCSV(){
  const head=["Order No","Date","Customer","Phone","WhatsApp","Address","City","District","Product","Qty","Unit Price","Discount","Delivery Charge","Courier Cost","Total","Product Cost","Profit","Payment","Status","Tracking","Notes"];
  const rows=[...DB.orders].sort((a,b)=>a.no-b.no).map(o=>{ const c=orderCalc(o); const p=product(o.productId);
    return [orderNo(o),o.date,o.customer,o.phone,o.whatsapp||"",o.address,o.city,o.district,p?p.name:"",c.qty,o.price,o.discount,o.delivery,o.courierCost,c.total,c.productCost,c.profit,o.payment,o.status,o.tracking,o.notes].map(csvq).join(","); });
  download("coverlanka-orders-"+today()+".csv", "﻿"+[head.join(","),...rows].join("\r\n"), "text/csv");
}
function exportCustomersCSV(){
  const head=["Name","Phone","WhatsApp","Address","City","District","Orders","Delivered","Returned","Spent","First order","Last order"];
  const rows=customers().map(c=>[c.name,c.phone,c.whatsapp||"",c.address,c.city,c.district,c.orders,c.delivered,c.returned,c.spent,c.first,c.last].map(csvq).join(","));
  download("coverlanka-customers-"+today()+".csv", "﻿"+[head.join(","),...rows].join("\r\n"), "text/csv");
}

boot();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e=>{ if(e.data&&e.data.go==="orders"&&DB){ closeModal(); page="orders"; render(); } });
</script>
