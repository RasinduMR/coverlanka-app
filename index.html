<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fe5f03">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CoverLanka">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>CoverLanka Manager</title>
<script>try{var t=localStorage.getItem("coverlanka_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
  @font-face{font-family:"Outfit";src:url("fonts/outfit-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Outfit";src:url("fonts/outfit-latin-500-normal.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Outfit";src:url("fonts/outfit-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Outfit";src:url("fonts/outfit-latin-700-normal.woff2") format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Manrope";src:url("fonts/manrope-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Manrope";src:url("fonts/manrope-latin-500-normal.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Manrope";src:url("fonts/manrope-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Manrope";src:url("fonts/manrope-latin-700-normal.woff2") format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Sinhala";src:url("fonts/noto-sans-sinhala-sinhala-400-normal.woff2") format("woff2");font-weight:400;unicode-range:U+0D80-0DFF,U+200C-200D}
  @font-face{font-family:"Sinhala";src:url("fonts/noto-sans-sinhala-sinhala-600-normal.woff2") format("woff2");font-weight:600 700;unicode-range:U+0D80-0DFF,U+200C-200D}

  :root{
    --bg:#f3f4f6; --panel:#ffffff; --panel-2:#f8f9fa; --ink:#15171a; --ink-2:#3b4048; --muted:#6b717b; --line:#e3e6ea; --line-2:#d5d9df;
    --brand:#fe5f03; --brand-ink:#c94a00; --brand-soft:#fff1e8; --brand-line:#ffd2b5; --on-brand:#ffffff;
    --green:#17804a; --green-soft:#e4f4ea; --red:#c23a2f; --red-soft:#fbe8e6; --amber:#a8690c; --amber-soft:#fdf2dc;
    --blue:#1f62b0; --blue-soft:#e7eef9; --gray-soft:#eef0f2; --overlay:rgba(15,17,20,.48);
    --shadow-1:0 1px 2px rgba(16,20,26,.05); --shadow-2:0 18px 50px -12px rgba(16,20,26,.28);
    --hero:#15171a; --hero-ink:#f3f4f6; --hero-muted:#9aa1aa; --track:#2b3036;
    --r-s:6px; --r-m:10px; --r-l:16px;
    --ease:cubic-bezier(.2,.8,.2,1);
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --bg:#0f1113; --panel:#171a1d; --panel-2:#1c2024; --ink:#eceef0; --ink-2:#c5cad1; --muted:#949ba5; --line:#262b30; --line-2:#323840;
    --brand:#ff7124; --brand-ink:#ff9a5c; --brand-soft:#2a1a10; --brand-line:#5a3218; --on-brand:#111;
    --green:#4cc283; --green-soft:#12271b; --red:#ff7b6e; --red-soft:#2c1614; --amber:#e6b04f; --amber-soft:#2a2010;
    --blue:#7fb0f0; --blue-soft:#14202f; --gray-soft:#22262b; --overlay:rgba(0,0,0,.6);
    --shadow-1:0 1px 0 rgba(255,255,255,.02); --shadow-2:0 24px 60px -12px rgba(0,0,0,.7);
    --hero:#1b1f23; --hero-ink:#f3f4f6; --hero-muted:#959ca6; --track:#2c3238;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Manrope","Sinhala","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
  body.theming, body.theming *{transition:background-color .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease)!important}
  h1,h2,h3,.v,.hero-num,.display{font-family:"Outfit","Sinhala","Segoe UI",sans-serif}
  ::selection{background:var(--brand);color:#fff}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .app{display:flex;min-height:100vh}

  /* ---------- sidebar ---------- */
  nav{width:232px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:10}
  .brand{padding:24px 22px 18px}
  .brand img{width:100%;display:block}
  .logo-dark{display:none!important}
  html[data-theme="dark"] .logo-light{display:none!important}
  html[data-theme="dark"] .logo-dark{display:block!important}
  .brand small{display:block;font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
  .navlist{padding:6px 12px;display:flex;flex-direction:column;gap:2px}
  .navlist button{all:unset;cursor:pointer;padding:10px 12px;border-radius:9px;display:flex;gap:11px;align-items:center;font-size:14px;font-weight:500;color:var(--ink-2);position:relative;transition:background .18s var(--ease),color .18s var(--ease)}
  .navlist button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .navlist button:hover{background:var(--gray-soft);color:var(--ink)}
  .navlist button.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
  .navlist button.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
  .navlist button.active svg{opacity:1}
  .navlist button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
  .navfoot{margin-top:auto;padding:14px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .navfoot .tip{font-size:12px;color:var(--muted);line-height:1.5}
  .navfoot .tip kbd{font-family:inherit;font-size:11px;font-weight:700;background:var(--gray-soft);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink)}
  .navfoot .tools{display:flex;gap:6px}
  .iconbtn{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:34px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2);transition:background .18s var(--ease)}
  .iconbtn:hover{background:var(--gray-soft)}
  .iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  main{margin-left:232px;flex:1;padding:30px 36px 48px;max-width:1440px;min-width:0}
  .page{animation:pagein .28s var(--ease)}
  @keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:26px;font-weight:600;letter-spacing:-.3px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}
  .section-title{font-family:"Outfit",sans-serif;font-size:17px;font-weight:600;color:var(--ink);margin:30px 0 0}
  .section-title span{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}

  /* ---------- hero (business value gauge) ---------- */
  .hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r-l);padding:26px 30px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;margin:18px 0 6px;position:relative;overflow:hidden}
  .hero .lbl{color:var(--hero-muted);font-size:14px}
  .hero-num{font-size:44px;font-weight:600;letter-spacing:-1px;line-height:1.1;margin:6px 0 4px}
  .hero .meta{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
  .hero .meta div{font-size:13px;color:var(--hero-muted)}
  .hero .meta b{display:block;font-family:"Outfit",sans-serif;font-size:18px;font-weight:600;color:var(--hero-ink);margin-top:2px}
  .hero .note{margin-top:16px;font-size:13px;color:var(--hero-muted)}
  .hero .note b{color:var(--hero-ink)}
  .gauge{position:relative;justify-self:end;width:100%;max-width:400px}
  .gauge svg{width:100%;display:block;overflow:visible}
  .gauge .track{stroke:var(--track)}
  .gauge .fill{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease)}
  .gauge .pct{position:absolute;left:0;right:0;bottom:8%;text-align:center}
  .gauge .pct b{font-family:"Outfit",sans-serif;font-size:40px;font-weight:600;display:block;line-height:1}
  .gauge .pct span{font-size:12px;color:var(--hero-muted)}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin:14px 0 22px}
  @media (max-width:1150px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--panel);padding:16px 18px}
  .stat .k{color:var(--muted);font-size:13px}
  .stat .v{font-size:25px;font-weight:600;letter-spacing:-.3px;margin-top:4px}
  .stat .s{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.pos .v{color:var(--green)} .stat.neg .v{color:var(--red)}
  .stat.accent{box-shadow:inset 3px 0 0 var(--brand)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin:6px 0 20px}
  .card{background:var(--panel);padding:16px 18px}
  .card .k{color:var(--muted);font-size:13px}
  .card .v{font-family:"Outfit",sans-serif;font-size:24px;font-weight:600;margin-top:4px}
  .card .s{font-size:12px;color:var(--muted);margin-top:2px}
  .card.or{box-shadow:inset 3px 0 0 var(--brand)}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;margin-bottom:18px;box-shadow:var(--shadow-1)}
  .panel h3{margin:0 0 14px;font-size:16px;font-weight:600}
  .panel h3 .muted{font-weight:400;font-family:"Manrope",sans-serif;font-size:13px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .two-1{display:grid;grid-template-columns:2fr 1fr;gap:18px}
  @media (max-width:1150px){.two,.two-1{grid-template-columns:1fr}}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr{transition:background .15s var(--ease)}
  tbody tr:hover{background:var(--panel-2)}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;white-space:nowrap}
  .tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .empty{color:var(--muted);text-align:center;padding:34px 10px}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

  /* ---------- controls ---------- */
  button.btn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:background .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease)}
  button.btn:hover{background:var(--gray-soft)}
  button.btn:active{transform:translateY(1px)}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  html[data-theme="dark"] button.primary{color:#111}
  button.primary:hover{background:var(--brand);filter:brightness(1.07)}
  button.danger{color:var(--red)}
  button.sm{padding:5px 10px;font-size:12px;border-radius:7px}
  button:disabled{opacity:.5;cursor:default}
  .wa{color:#13a150!important}
  button.btn svg{width:15px;height:15px;vertical-align:-3px;margin-right:6px;fill:currentColor}
  button.more{padding:5px 8px;line-height:0}
  button.more svg{margin:0}
  .cell1{font-weight:600;white-space:nowrap}
  .cell2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
  .cell2.dx-ok{color:var(--green);font-weight:600} .cell2.dx-go{color:var(--amber);font-weight:600}
  button.more svg{width:16px;height:16px;fill:currentColor}
  .menu hr{border:none;border-top:1px solid var(--line);margin:5px 4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
  .chips button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--gray-soft);color:var(--ink-2)}
  .chips button:hover{background:var(--brand-soft);color:var(--brand-ink)}
  .wa-preview{white-space:pre-wrap;background:#dcf8c6;color:#111;border-radius:10px 10px 2px 10px;padding:10px 12px;font-size:13.5px;line-height:1.5;max-width:420px;margin-left:auto;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  html[data-theme="dark"] .wa-preview{background:#005c4b;color:#e9edef}
  html[data-theme="dark"] .wa{color:#3ddc84!important}
  .wa svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px;fill:currentColor}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel);color:var(--ink);width:100%;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  input.filled,textarea.filled,select.filled{background:var(--brand-soft);border-color:var(--brand)}
  input[type="month"],input[type="date"]{font-feature-settings:"tnum" 1}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 16px}
  .full{grid-column:1/-1}
  .seg{display:inline-flex;background:var(--gray-soft);border-radius:10px;padding:3px;gap:2px}
  .seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-1)}

  .s-New{background:var(--gray-soft);color:var(--ink-2)}
  .s-Confirmed{background:var(--blue-soft);color:var(--blue)}
  .s-Dispatched{background:var(--amber-soft);color:var(--amber)}
  .s-Delivered{background:var(--green-soft);color:var(--green)}
  .s-Returned{background:var(--red-soft);color:var(--red)}
  .s-Cancelled{background:var(--gray-soft);color:var(--muted)}
  .q-Draft{background:var(--gray-soft);color:var(--ink-2)}
  .q-Sent{background:var(--blue-soft);color:var(--blue)}
  .q-Accepted{background:var(--green-soft);color:var(--green)}
  .q-Declined{background:var(--red-soft);color:var(--red)}
  .q-Expired{background:var(--amber-soft);color:var(--amber)}
  select.status{width:auto;padding:5px 26px 5px 11px;font-size:12px;font-weight:700;border-radius:20px;border:none;cursor:pointer}
  .ok{color:var(--green);font-weight:700}.low{color:var(--amber);font-weight:700}.out{color:var(--red);font-weight:700}
  .alert{background:var(--amber-soft);color:var(--amber);padding:11px 14px;border-radius:var(--r-m);margin-bottom:10px;font-weight:500}
  .alert.red{background:var(--red-soft);color:var(--red)}
  .alert b{font-weight:700}

  /* ---------- modal, menu, toast ---------- */
  .modal-bg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:34px 20px;overflow:auto;z-index:50;opacity:0;visibility:hidden;transition:opacity .22s var(--ease),visibility 0s .22s;backdrop-filter:blur(3px)}
  .modal-bg.open{opacity:1;visibility:visible;transition:opacity .22s var(--ease)}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);width:100%;max-width:780px;padding:26px 28px;box-shadow:var(--shadow-2);transform:translateY(12px) scale(.985);transition:transform .28s var(--ease)}
  .modal-bg.open .modal{transform:none}
  .modal h2{margin:0 0 16px;font-size:20px;font-weight:600}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .totalbox{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 16px;display:flex;gap:26px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .totalbox b{font-family:"Outfit",sans-serif;font-size:18px;color:var(--ink);font-weight:600}
  .muted{color:var(--muted)}
  .menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);z-index:60;min-width:250px;padding:6px;animation:menuin .16s var(--ease)}
  @keyframes menuin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .menu .mh{font-size:12px;color:var(--muted);padding:7px 11px 5px}
  .menu button{all:unset;display:block;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;width:100%;box-sizing:border-box;color:var(--ink)}
  .menu button:hover{background:var(--gray-soft)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;opacity:0;transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:99;max-width:480px;font-weight:600;font-size:13px;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.act{pointer-events:auto;display:flex;align-items:center;gap:16px;padding-right:10px;white-space:nowrap}
  .toast-btn{background:none;border:0;color:var(--brand);font:inherit;font-weight:800;cursor:pointer;padding:6px 8px;border-radius:8px}
  .toast-btn:hover{background:rgba(255,255,255,.12)}
  .wa-row{display:grid;grid-template-columns:220px 1fr auto;gap:12px;margin-top:12px;align-items:start}
  @media (max-width:760px){
    .wa-row{grid-template-columns:1fr auto;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
    .wa-row:first-child{border-top:0;padding-top:0}
    .wa-name{grid-column:1;grid-row:1;font-weight:700}
    .wa-del{grid-column:2;grid-row:1;align-self:center}
    .wa-text{grid-column:1 / -1;grid-row:2;min-height:150px}
  }
  .dev-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .dev-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel-2)}
  .dev-item svg{width:22px;height:22px;fill:none;stroke:var(--ink-2,currentColor);stroke-width:1.6;flex:none}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);vertical-align:1px;margin-left:4px}
  .np-on{font-weight:700;color:var(--green,#1f9d55)}
  .np-on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:1px}
  .chk{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
  .chk input{width:20px;height:20px;accent-color:var(--brand);margin:0}
  .drivebox{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel-2);margin-bottom:14px}
  .drv-ic{width:26px;height:26px;fill:none;stroke:var(--brand);stroke-width:1.6;stroke-linejoin:round;flex:none;margin-top:2px}
  .drv-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
  .drv-item{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel-2)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .actions-cell{white-space:nowrap;text-align:right}
  .drop{border:1.5px dashed var(--brand-line);background:var(--brand-soft);border-radius:var(--r-m);padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:18px;transition:border-color .18s var(--ease)}
  .drop.over{border-color:var(--brand)}
  .drop img{max-height:90px;max-width:120px;border-radius:8px;border:1px solid var(--line)}
  .drop .t{flex:1;font-size:13px;color:var(--ink-2)}
  .drop .t b{display:block;font-size:14px;margin-bottom:2px;color:var(--ink)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--brand-line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .badge{display:inline-block;background:var(--red-soft);color:var(--red);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px}
  .badge.good{background:var(--green-soft);color:var(--green)}
  .barline{display:flex;align-items:center;gap:10px}
  .barline .b{flex:1;height:6px;background:var(--gray-soft);border-radius:4px;overflow:hidden}
  .barline .b div{height:100%;background:var(--brand);border-radius:4px}
  .remind{border:1px solid var(--brand-line);background:var(--panel);border-radius:var(--r-m);padding:16px 18px;margin:16px 0 4px;box-shadow:inset 3px 0 0 var(--brand)}
  .remind h3{margin:0 0 8px;font-size:15px}
  .remind td{padding:8px 10px}
  .summary{white-space:pre-wrap;line-height:1.75;font-size:14px;color:var(--ink-2)}
  .claude-mark{display:inline-flex;align-items:center;gap:7px}
  .claude-mark i{width:8px;height:8px;border-radius:50%;background:var(--brand);display:inline-block}

  /* ---------- lock ---------- */
  #lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  #lock.on{display:flex}
  #lock .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:36px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow-2);width:360px}
  #lock img{width:240px}
  #lock input{width:220px;text-align:center;font-size:24px;letter-spacing:10px;font-family:"Outfit",sans-serif}
  #lock .shake{animation:shake .35s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

  @media (max-width:1280px){
    nav{width:204px} main{margin-left:204px;padding:24px 22px 40px}
    .brand{padding:20px 18px 14px}
    td{padding:10px 7px} th{padding:9px 7px}
    select.status{padding:5px 22px 5px 9px}
    .hero{padding:22px 24px} .hero-num{font-size:38px}
  }
  @media (max-width:1180px){
    button.wa .wa-t{display:none} button.wa svg{margin:0}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* ---------- print ---------- */
  #printArea{display:none}
  @media print{
    html,body{background:#fff!important;color:#000}
    .app,.modal-bg,.toast,#lock{display:none!important}
    #printArea{display:block}
  }
  .inv,.rep,.label{font-family:"Manrope","Sinhala",Arial,sans-serif;color:#000}
  .inv{padding:10px 6px;max-width:700px}
  .inv table td,.inv table th{border-bottom:1px solid #ccc;padding:7px 6px;background:none;color:#000}
  .inv .tot td{font-weight:700;border-top:2px solid #000}
  .label{border:2px dashed #000;padding:14px 18px;width:430px;font-size:15px;line-height:1.45;margin-bottom:14px}
  .label .big{font-size:20px;font-weight:700}
  .rep{padding:4px 2px;font-size:13px}
  .rep h1{font-family:"Outfit",sans-serif;font-size:24px;margin:0}
  .rep h2{font-family:"Outfit",sans-serif;font-size:16px;margin:20px 0 8px;border-bottom:2px solid #fe5f03;padding-bottom:4px}
  .rep table{width:100%;border-collapse:collapse}
  .rep td,.rep th{border-bottom:1px solid #ddd;padding:6px;text-align:left;background:none;color:#000;font-size:12.5px}
  .rep td.n,.rep th.n{text-align:right}
  .rep .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .rep .kp div{border:1px solid #ddd;border-radius:6px;padding:8px 10px;font-size:11.5px;color:#555}
  .rep .kp b{display:block;font-family:"Outfit",sans-serif;font-size:17px;color:#000;margin-top:2px}

  /* ================= APPLE-STYLE GLASS LAYER ================= */
  :root{ --r-s:8px; --r-m:16px; --r-l:24px; --spring:cubic-bezier(.32,.72,0,1);
    --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.78); --glass-line:rgba(255,255,255,.7); --glass-edge:rgba(15,20,30,.08);
    --panel:rgba(255,255,255,.86); --bg:#eef0f3; }
  html[data-theme="dark"]{ --glass:rgba(30,33,38,.58); --glass-strong:rgba(34,37,43,.8); --glass-line:rgba(255,255,255,.09); --glass-edge:rgba(0,0,0,.4);
    --panel:rgba(26,29,33,.88); --bg:#0b0c0e; }
  body{font-family:-apple-system,BlinkMacSystemFont,"Manrope","Sinhala","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em}
  h1,h2,h3,.v,.hero-num,.display,.stat .v,.card .v{font-family:-apple-system,BlinkMacSystemFont,"Outfit","Sinhala",sans-serif;letter-spacing:-.02em}
  /* soft colour behind the glass */
  body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
    background:radial-gradient(40vmax 40vmax at 8% 6%, rgba(254,95,3,.16), transparent 60%),
               radial-gradient(42vmax 42vmax at 96% 30%, rgba(70,120,255,.10), transparent 60%),
               radial-gradient(40vmax 40vmax at 40% 105%, rgba(254,140,60,.10), transparent 60%), var(--bg)}
  .glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--glass-line);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 10px 40px -12px var(--glass-edge)}
  html[data-theme="dark"] .glass{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 14px 44px -12px rgba(0,0,0,.6)}
  nav{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-right:1px solid var(--glass-line)}
  .panel,.stats,.cards{border-color:var(--glass-line)}
  .panel{border-radius:var(--r-m)}
  .stats,.cards{border-radius:var(--r-m);background:var(--glass-line)}
  .stat,.card{background:var(--panel)}
  .modal{background:var(--glass-strong);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border:1px solid var(--glass-line);border-radius:var(--r-l)}
  .modal-bg{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:rgba(10,12,16,.32)}
  .menu{background:var(--glass-strong);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border:1px solid var(--glass-line);border-radius:16px}
  .toast{background:rgba(20,22,26,.82);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:16px;padding:12px 18px}
  button.btn{border-radius:12px;transition:transform .35s var(--spring),background .2s,border-color .2s,box-shadow .2s}
  button.btn:active{transform:scale(.96)}
  button.primary{box-shadow:0 6px 18px -6px rgba(254,95,3,.55)}
  input,select,textarea{border-radius:12px}
  .navlist button{border-radius:12px;transition:background .25s var(--spring),color .2s,transform .35s var(--spring)}
  .navlist button:active{transform:scale(.97)}
  .hero{border-radius:var(--r-l);box-shadow:0 24px 60px -24px rgba(0,0,0,.45)}
  .seg{border-radius:12px}.seg button{border-radius:10px;transition:background .25s var(--spring)}
  .remind,.alert{border-radius:var(--r-m)}

  /* sync dot */
  .sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34c759;box-shadow:0 0 0 3px rgba(52,199,89,.18);transition:background .3s}
  .sync.busy{background:#ff9f0a;box-shadow:0 0 0 3px rgba(255,159,10,.2);animation:pulse 1s ease-in-out infinite}
  .sync.off{background:#8e8e93;box-shadow:0 0 0 3px rgba(142,142,147,.2)}
  @keyframes pulse{50%{opacity:.4}}
  .syncrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}

  /* login / boot */
  #boot{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:24px;background:transparent}
  #boot.on{display:flex}
  #boot::before{content:"";position:absolute;inset:0;background:var(--bg);z-index:-1}
  .login{width:100%;max-width:380px;border-radius:28px;padding:32px 28px;display:flex;flex-direction:column;gap:12px;animation:rise .6s var(--spring)}
  .login img{width:220px;align-self:center;margin-bottom:6px}
  .login h2{margin:6px 0 0;font-size:24px}
  .login input{font-size:16px;padding:13px 14px}
  .btn.big{padding:14px 16px;font-size:15px;border-radius:14px}
  .lg-msg{color:var(--red);font-size:13px;min-height:18px;text-align:center}
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}

  /* mobile-only pieces are hidden on big screens */
  #mtop,#tabbar,#fab{display:none}

  /* ================= PHONE ================= */
  @media (max-width:760px){
    body{font-size:15px}
    nav{display:none}
    main{margin-left:0;padding:calc(66px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom));max-width:none}
    #mtop{display:flex;position:fixed;top:0;left:0;right:0;z-index:40;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-radius:0;border-width:0 0 1px 0}
    #mtop img{height:26px}
    #mtop .spacer{flex:1}
    #mtop .iconbtn{flex:none;width:36px;height:36px;border-radius:50%;border:none;background:var(--gray-soft)}
    #mtop .iconbtn span{display:none}
    #tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;border-radius:26px;padding:6px;justify-content:space-around}
    #tabbar button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:20px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:color .2s,background .3s var(--spring),transform .35s var(--spring);-webkit-tap-highlight-color:transparent}
    #tabbar button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    #tabbar button.active{color:var(--brand);background:var(--brand-soft)}
    #tabbar button:active{transform:scale(.92)}
    #fab{display:flex;position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:39;width:58px;height:58px;border-radius:50%;border:none;background:var(--brand);color:#fff;align-items:center;justify-content:center;box-shadow:0 12px 30px -8px rgba(254,95,3,.7);cursor:pointer;transition:transform .4s var(--spring)}
    #fab:active{transform:scale(.9)}
    #fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
    #fab.hide{transform:scale(0)}
    h1{font-size:30px;font-weight:700}
    .sub{font-size:14px}
    .row > .spacer{display:none}
    .row{gap:8px}
    .hero{grid-template-columns:1fr;padding:22px 20px;gap:8px;border-radius:24px}
    .hero-num{font-size:36px}
    .gauge{justify-self:center;max-width:300px;margin-top:4px}
    .hero .meta{gap:18px}
    .stats{grid-template-columns:1fr 1fr}
    .stat{padding:14px}
    .stat .v{font-size:21px}
    .cards{grid-template-columns:1fr 1fr}
    .two,.two-1{grid-template-columns:1fr}
    .grid2,.grid3{grid-template-columns:1fr}
    .panel{padding:16px;border-radius:20px}
    .section-title{font-size:20px}
    /* lists become cards */
    table.resp thead{display:none}
    table.resp,table.resp tbody{display:block}
    table.resp tr{display:block;padding:12px 2px;border-bottom:1px solid var(--line)}
    table.resp tr:last-child{border-bottom:none}
    table.resp tbody tr:hover{background:none}
    table.resp td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:none;padding:4px 0;text-align:right}
    table.resp td::before{content:attr(data-label);color:var(--muted);font-size:13px;text-align:left;flex:none}
    table.resp td:first-child{font-size:16px}
    table.resp td.actions-cell{justify-content:flex-start;flex-wrap:wrap;gap:8px;padding-top:10px}
    table.resp td.actions-cell::before,table.resp td:empty::before{display:none}
    table.resp td .tdv{text-align:right;min-width:0}
    table.resp td .tdv .cell2{display:block;margin:2px 0 0}
    table.resp td:first-child .tdv{font-size:17px}
    td button.btn.sm{padding:9px 14px;font-size:13px}
    button.wa .wa-t{display:inline!important} button.wa svg{margin-right:6px!important}
    .tablewrap{margin:0;padding:0}
    /* sheets slide up from the bottom, like iOS */
    .modal-bg{align-items:flex-end;padding:0}
    .modal{max-width:none;border-radius:28px 28px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));max-height:93vh;overflow:auto;transform:translateY(100%);transition:transform .5s var(--spring)}
    .modal::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 14px}
    .modal-bg.open .modal{transform:none}
    .modal .actions{position:sticky;bottom:-24px;margin:18px -18px -24px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
    .modal .actions .btn{flex:1;padding:14px}
    input,select,textarea{font-size:16px;padding:12px 13px}
    .drop{flex-wrap:wrap}
    .toast{bottom:calc(100px + env(safe-area-inset-bottom));max-width:calc(100vw - 32px)}
    .menu{min-width:260px}
    .menu button{padding:13px 12px;font-size:15px}
    .remind td{display:block;padding:3px 0;border:none}
    .remind tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
    #lock .card{width:calc(100vw - 40px)}
  }
  /* more sheet */
  .more-list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .more-list button{all:unset;display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;color:var(--ink)}
  .more-list button:active{background:var(--gray-soft)}
  .more-list svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Main">
    <div class="brand"><img class="logo-light" src="logo.png" alt="CoverLanka"><img class="logo-dark" src="logo-dark.png" alt="CoverLanka"><small>Business manager</small></div>
    <div class="navlist">
      <button data-page="dashboard" class="active"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/></svg>Dashboard</button>
      <button data-page="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Orders</button>
      <button data-page="customers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>Customers</button>
      <button data-page="quotes"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Quotations</button>
      <button data-page="stock"><svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>Stock</button>
      <button data-page="expenses"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Expenses</button>
      <button data-page="partners"><svg viewBox="0 0 24 24"><path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3s-4.5 1.3-4.5 3 2 2.6 4.5 3 4.5 1.3 4.5 3-2 3-4.5 3-4.5-1.3-4.5-3"/></svg>Capital & partners</button>
      <button data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Settings & backup</button>
    </div>
    <div class="navfoot">
      <div class="syncrow"><span id="syncDot" class="sync"></span><span id="syncText">Synced</span></div>
      <div class="tip">Got an order? Press <kbd>Ctrl</kbd> + <kbd>V</kbd> with the screenshot.</div>
      <div class="tools">
        <button class="iconbtn" id="themeBtn" title="Switch light / dark"></button>
        <button class="iconbtn" id="lockBtn" title="Lock the app" style="display:none"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Lock</button>
      </div>
    </div>
  </nav>
  <main id="main"></main>
</div>

<header id="mtop" class="glass">
  <img class="logo-light" src="logo.png" alt="CoverLanka"><img class="logo-dark" src="logo-dark.png" alt="CoverLanka">
  <div class="spacer"></div>
  <span class="syncrow"><span id="syncDotM" class="sync"></span></span>
  <button class="iconbtn" id="themeBtnM" aria-label="Switch light or dark"></button>
</header>
<div id="tabbar" class="glass" role="navigation" aria-label="Main">
  <button data-tab="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/></svg>Home</button>
  <button data-tab="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Orders</button>
  <button data-tab="quotes"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Quotes</button>
  <button data-tab="stock"><svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>Stock</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
</div>
<button id="fab" aria-label="New order"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="boot"></div>

<div class="toast" id="toast" role="status"></div>
<div id="lock">
  <div class="card">
    <img class="logo-light" src="logo.png" alt="CoverLanka"><img class="logo-dark" src="logo-dark.png" alt="CoverLanka">
    <div class="muted">Enter your PIN to open</div>
    <input type="password" id="lockPin" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN">
    <button class="btn primary" id="lockGo" style="width:220px">Unlock</button>
    <div id="lockMsg" style="color:var(--red);font-size:13px;min-height:18px"></div>
    <a href="#" id="lockForgot" style="font-size:12px;color:var(--muted)">Forgot PIN?</a>
  </div>
</div>
<div id="printArea"></div>

<script src="config.js"></script>

<script>
/* ================= CONSTANTS ================= */
const STATUSES = ["New","Confirmed","Dispatched","Delivered","Returned","Cancelled"];
const PAYMENTS = ["COD","Bank Transfer"];
const EXP_CATS = ["Facebook Ads","Ad production","Packaging","Stock transport","Travel","Setup & registration","Other"];
const DISTRICTS = ["Ampara","Anuradhapura","Badulla","Batticaloa","Colombo","Galle","Gampaha","Hambantota","Jaffna","Kalutara","Kandy","Kegalle","Kilinochchi","Kurunegala","Mannar","Matale","Matara","Monaragala","Mullaitivu","Nuwara Eliya","Polonnaruwa","Puttalam","Ratnapura","Trincomalee","Vavuniya"];
const LS_KEY = "coverlanka_data_v1";

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// Brings older data up to date and loads the starting figures once.
function migrate(d){
  d.settings = d.settings || {};
  if(d.settings.claudeModel==null) d.settings.claudeModel = DEFAULT_MODEL;
  if(d.settings.claudeKey==null) d.settings.claudeKey = "";
  if(!d.settings.wa) d.settings.wa = JSON.parse(JSON.stringify(DEFAULT_WA));
  if(d.settings.backupFolder==null) d.settings.backupFolder = "";
  if(d.settings.remindNewDays==null) d.settings.remindNewDays = 2;
  if(d.settings.remindDispatchDays==null) d.settings.remindDispatchDays = 5;
  if((d.version||1) < 2){
    // cost price confirmed as Rs. 1,800
    d.products.forEach(p=>{ if(p.code==="RC-001" && num(p.cost)===2900) p.cost=1800; });
    d.orders.forEach(o=>{ if(num(o.unitCost)===2900) o.unitCost=1800; });
    d.restocks.forEach(r=>{ if(r.amountPaid==null){ const p=d.products.find(x=>x.id===r.productId); r.amountPaid = num(r.qty)*(p?num(p.cost):0); } });
    if(!d.partners) d.partners = [1,2,3,4].map(i=>({ id:uid(), name:"Partner "+i, amount:25000, date:today() }));
    if(!d.startupLoaded){
      const E=(c,desc,a)=>({ id:uid(), date:today(), category:c, description:desc, amount:a });
      d.expenses.push(
        E("Stock transport","Supplier → Pettah",300),
        E("Stock transport","Pettah → Matara",430),
        E("Stock transport","Matara → our place",570),
        E("Setup & registration","Business bank account opening",2000),
        E("Setup & registration","Business SIM card",300),
        E("Travel","Travel for bank account & SIM",740),
        E("Packaging","Packing covers (50)",1500),
        E("Setup & registration","ATM card",500),
        E("Setup & registration","Domex registration",1500),
        E("Travel","Travel for Domex registration",660),
        E("Ad production","Ad video production",7900),
        E("Ad production","Delivery to the ad shoot location",500),
        E("Facebook Ads","Facebook ad budget (running)",5000)
      );
      d.startupLoaded = true;
    }
    d.version = 2;
  }
  d.orders.forEach(o=>{ if(o.district==null) o.district=""; });
  if(!d.quotes) d.quotes=[]; if(!d.nextQuoteNo) d.nextQuoteNo=1;
  if(!d.settings.pricing) d.settings.pricing={ firstKg:425, extraKg:150, courierFirstKg:425, courierExtraKg:150, tiers:[{min:5,off:150},{min:10,off:300}] };
  d.products.forEach(p=>{ if(p.weightKg==null) p.weightKg=1; });
  return d;
}
let DB;
/* ================= CLOUD STORAGE (Firebase) =================
   Every list is a Firestore collection (one document per item), so 4 phones can
   add and change things at the same time without overwriting each other.
   Settings that belong to one phone only (theme, PIN) stay on that phone. */
const COLS = ["orders","products","restocks","expenses","partners","quotes","trash","devices"];
const LOCAL_SETTING_KEYS = ["theme","pinHash","pinSalt","recoveryHash","backupFolder","lastExtraBackup","lastExtraBackupDay"];
const CLOUD = { app:null, auth:null, db:null, user:null, ready:false, unsub:[], last:{}, lastSettings:"", pending:0, online:navigator.onLine };
function localSettings(){ try{ return JSON.parse(localStorage.getItem("coverlanka_local")||"{}"); }catch(e){ return {}; } }
function saveLocalSettings(){ const o={}; LOCAL_SETTING_KEYS.forEach(k=>{ if(DB.settings[k]!=null) o[k]=DB.settings[k]; }); try{ localStorage.setItem("coverlanka_local", JSON.stringify(o)); }catch(e){} }
function sharedSettings(){ const s={...DB.settings}; LOCAL_SETTING_KEYS.forEach(k=>delete s[k]); return { settings:s, lastSummary:DB.lastSummary||null, startupLoaded:!!DB.startupLoaded, version:DB.version||1 }; }
function emptyDB(){ return { version:2, settings:{}, products:[], restocks:[], orders:[], expenses:[], partners:[], quotes:[], trash:[], devices:[], startupLoaded:true }; }

function setSyncState(){
  const st = !CLOUD.online ? "off" : (CLOUD.pending>0 ? "busy" : "ok");
  const m=document.getElementById("syncDotM"); if(m) m.className="sync "+st;
  const el=document.getElementById("syncDot"); if(!el) return;
  el.className="sync "+st;
  el.title = st==="off" ? "Offline — changes are saved on this phone and will sync when internet is back" : (st==="busy" ? "Saving…" : "All changes saved and shared");
  const t=document.getElementById("syncText"); if(t) t.textContent = st==="off" ? "Offline" : (st==="busy" ? "Saving…" : "Synced");
}
window.addEventListener("online",()=>{ CLOUD.online=true; setSyncState(); });
window.addEventListener("offline",()=>{ CLOUD.online=false; setSyncState(); });

function saveDB(){
  saveLocalSettings();
  if(!CLOUD.ready) return;
  const F=window.FB, batches=[]; let b=F.writeBatch(CLOUD.db), n=0;
  const put=(ref,data)=>{ b.set(ref,data); if(++n>=450){ batches.push(b); b=F.writeBatch(CLOUD.db); n=0; } };
  const del=(ref)=>{ b.delete(ref); if(++n>=450){ batches.push(b); b=F.writeBatch(CLOUD.db); n=0; } };
  COLS.forEach(col=>{
    const last=CLOUD.last[col]||(CLOUD.last[col]=new Map()); const seen=new Set();
    (DB[col]||[]).forEach(item=>{
      if(!item.id) item.id=uid();
      seen.add(item.id);
      const j=JSON.stringify(item);
      if(last.get(item.id)!==j){ last.set(item.id,j); put(F.doc(CLOUD.db,col,item.id), JSON.parse(j)); }
    });
    [...last.keys()].forEach(id=>{ if(!seen.has(id)){ last.delete(id); del(F.doc(CLOUD.db,col,id)); } });
  });
  const ss=JSON.stringify(sharedSettings());
  if(ss!==CLOUD.lastSettings){ CLOUD.lastSettings=ss; put(F.doc(CLOUD.db,"meta","settings"), JSON.parse(ss)); }
  if(n>0) batches.push(b);
  batches.forEach(bt=>{ CLOUD.pending++; setSyncState();
    bt.commit().catch(e=>{ console.error(e); toast("Could not save online: "+e.message); }).finally(()=>{ CLOUD.pending--; setSyncState(); }); });
}

/* Order / quotation numbers come from a shared counter so two phones never get the same number. */
async function nextNumber(kind){
  const F=window.FB; const localMax = kind==="order" ? Math.max(0,...DB.orders.map(o=>num(o.no))) : Math.max(0,...(DB.quotes||[]).map(q=>num(q.no)));
  if(!CLOUD.ready) return localMax+1;
  const ref=F.doc(CLOUD.db,"meta","counters");
  const tx=F.runTransaction(CLOUD.db, async t=>{ const s=await t.get(ref); const cur=s.exists()?num(s.data()[kind]):0; const nx=Math.max(cur,localMax)+1; t.set(ref,{[kind]:nx},{merge:true}); return nx; });
  try{ return await Promise.race([tx, new Promise((_,rej)=>setTimeout(()=>rej(new Error("offline")),5000))]); }
  catch(e){ return localMax+1; }   // offline: use the next free number on this phone
}

let _renderT=null;
function scheduleRender(){
  clearTimeout(_renderT);
  _renderT=setTimeout(()=>{
    const a=document.activeElement;
    if(a && a.closest && a.closest("#main") && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type!=="checkbox"){ scheduleRender(); return; } // don't redraw while typing
    if(DB) render();
  }, 250);
}

function startListening(){
  const F=window.FB;
  CLOUD.unsub.forEach(u=>u()); CLOUD.unsub=[];
  let firstLoads = COLS.length+1;
  return new Promise(resolve=>{
    const done=()=>{ if(--firstLoads===0) resolve(); };
    COLS.forEach(col=>{
      let first=true; const last=CLOUD.last[col]=new Map();
      CLOUD.unsub.push(F.onSnapshot(F.collection(CLOUD.db,col), snap=>{
        snap.docChanges().forEach(ch=>{
          const id=ch.doc.id, arr=DB[col]||(DB[col]=[]);
          const i=arr.findIndex(x=>x.id===id);
          if(ch.type==="removed"){ if(i>=0) arr.splice(i,1); last.delete(id); }
          else { const data={...ch.doc.data(), id}; last.set(id, JSON.stringify(data)); if(i>=0) arr[i]=data; else arr.push(data); }
        });
        if(first){ first=false; done(); } else scheduleRender();
      }, err=>{ console.error(err); if(first){ first=false; done(); } toast("Sync problem: "+err.message); }));
    });
    let firstS=true;
    CLOUD.unsub.push(F.onSnapshot(F.doc(CLOUD.db,"meta","settings"), snap=>{
      if(snap.exists()){ const d=snap.data(); CLOUD.lastSettings=JSON.stringify(d);
        const loc={}; LOCAL_SETTING_KEYS.forEach(k=>{ if(DB.settings[k]!=null) loc[k]=DB.settings[k]; });
        DB.settings={...(d.settings||{}), ...loc}; DB.lastSummary=d.lastSummary||null; DB.startupLoaded=d.startupLoaded; DB.version=d.version||DB.version; }
      if(firstS){ firstS=false; done(); } else scheduleRender();
    }, err=>{ console.error(err); if(firstS){ firstS=false; done(); } }));
  });
}

function uploadAll(d){
  const keepLocal={}; LOCAL_SETTING_KEYS.forEach(k=>{ if(DB.settings[k]!=null) keepLocal[k]=DB.settings[k]; });
  ["lastDriveBackup","lastDriveBackupDay"].forEach(k=>{ if(DB.settings[k]!=null) keepLocal[k]=DB.settings[k]; });   // a restore must not undo "already backed up today"
  const keepDevices=DB.devices||[];
  d=migrate(d);
  DB={...emptyDB(), ...d}; DB.devices=keepDevices; COLS.forEach(c=>{ DB[c]=DB[c]||[]; });
  DB.settings={...DB.settings, ...keepLocal};
  COLS.forEach(c=>{ if(!CLOUD.last[c]) CLOUD.last[c]=new Map(); }); CLOUD.lastSettings="";
  saveDB();   // the "last" maps know what is online now, so anything not in the backup gets removed for everyone
  const mo=Math.max(0,...DB.orders.map(o=>num(o.no))), mq=Math.max(0,...DB.quotes.map(q=>num(q.no)));
  window.FB.setDoc(window.FB.doc(CLOUD.db,"meta","counters"),{order:mo,quote:mq},{merge:true}).catch(()=>{});
  $("#boot").classList.remove("on"); toast("All set — data is online"); render();
}

async function boot(){
  DB=emptyDB(); Object.assign(DB.settings, localSettings());
  applyTheme();
  const cfg=window.CL_CONFIG&&CL_CONFIG.firebase;
  if(!cfg||!cfg.apiKey){ $("#boot").innerHTML='<div class="login glass"><h2>Not connected yet</h2><p class="muted">The Firebase settings (config.js) are missing.</p></div>'; $("#boot").classList.add("on"); return; }
  const F=window.FB;
  CLOUD.app=F.initializeApp(cfg);
  CLOUD.auth=F.getAuth(CLOUD.app);
  try{ CLOUD.db=F.initializeFirestore(CLOUD.app,{ localCache:F.persistentLocalCache({ tabManager:F.persistentMultipleTabManager() }) }); }
  catch(e){ CLOUD.db=F.initializeFirestore(CLOUD.app,{}); }
  showLoading("Opening…");
  F.onAuthStateChanged(CLOUD.auth, async user=>{
    CLOUD.user=user;
    if(!user){ CLOUD.ready=false; CLOUD.unsub.forEach(u=>u()); CLOUD.unsub=[]; showLogin(); return; }
    showLoading("Loading your data…");
    await startListening();
    CLOUD.ready=true; setSyncState();
    if(!DB.products.length && !DB.orders.length && !DB.settings.businessName){ showFirstRun(); return; }
    const before=JSON.stringify(sharedSettings());
    migrate(DB);
    if(JSON.stringify(sharedSettings())!==before || DB.products.some(p=>p.weightKg==null)) saveDB();
    $("#boot").classList.remove("on");
    if(location.hash==="#orders"){ page="orders"; history.replaceState(null,"",location.pathname); }
    purgeTrash();
    render();
    if(DB.settings.pinHash) showLock();
    setTimeout(autoDriveBackup, 4000);
    setTimeout(()=>syncDomex(), 9000);
  });
}
/* ================= GOOGLE DRIVE BACKUP =================
   A small Google Apps Script (in the team's Google Drive) receives a full copy
   of the data once a day and keeps the last 30 days in "CoverLanka Backups".
   It only accepts requests from someone signed in to the team account. */
function driveUrl(){ return (window.CL_CONFIG&&CL_CONFIG.driveBackupUrl)||""; }
function backupData(){
  const c=JSON.parse(JSON.stringify(DB)); c.settings=c.settings||{};
  c.settings.claudeKey=""; LOCAL_SETTING_KEYS.forEach(k=>delete c.settings[k]); delete c.devices;
  c.backupAt=new Date().toISOString(); return c;
}
async function driveCall(body){
  const url=driveUrl(); if(!url) throw new Error("Drive backup is not set up");
  if(!CLOUD.user||!CLOUD.user.getIdToken) throw new Error("Sign in first");
  if(!navigator.onLine) throw new Error("No internet connection");
  const token=await CLOUD.user.getIdToken();
  const r=await fetch(url,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({...body, token}) });
  let j; try{ j=await r.json(); }catch(e){ throw new Error("Google Drive did not answer properly"); }
  if(!j.ok) throw new Error(j.error||"Drive backup failed");
  return j;
}
async function driveBackup(tag){
  const now=new Date(), hm=String(now.getHours()).padStart(2,"0")+String(now.getMinutes()).padStart(2,"0");
  const name="coverlanka-backup-"+today()+(tag?"-"+tag+"-"+hm:"")+".json";
  const j=await driveCall({ action:"save", name, data:JSON.stringify(backupData()) });
  DB.settings.lastDriveBackup=now.toISOString();
  if(!tag) DB.settings.lastDriveBackupDay=today();
  saveDB(); return j;
}
let _autoBk=false;
async function autoDriveBackup(){
  if(_autoBk||!driveUrl()||!CLOUD.ready||!navigator.onLine||document.hidden) return;
  if(DB.settings.lastDriveBackupDay===today()) return;           // someone already backed up today
  if(!DB.orders.length && !DB.products.length) return;
  _autoBk=true;
  try{ await driveBackup(""); if(page==="settings") render(); }
  catch(e){ console.warn("Drive backup:",e.message); }
  finally{ _autoBk=false; }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ setTimeout(autoDriveBackup,3000); setTimeout(()=>syncDomex(),6000); } });
setInterval(autoDriveBackup, 30*60*1000);
setInterval(()=>syncDomex(), 20*60*1000);
/* a safety copy before anything that replaces all the data */
async function safetyBackup(tag){
  if(driveUrl()){ try{ await driveBackup(tag); return "drive"; }catch(e){ console.warn(e); } }
  download("coverlanka-backup-"+today()+"-"+tag+".json", JSON.stringify(backupData(),null,1), "application/json");
  return "file";
}
function niceTime(iso){ if(!iso) return ""; const d=new Date(iso); return d.toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function niceSize(b){ b=num(b); return b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB"; }
async function openDriveRestore(){
  modalKind="drive";
  $("#modal").innerHTML=`<h2>Restore from Google Drive</h2><p class="muted" style="margin-top:0">Choose a day. The app goes back to exactly how it was then, for everyone.</p><div id="dr_list"><div class="muted"><span class="spin"></span>Loading backups…</div></div><div class="actions"><button class="btn" id="dr_close">Close</button></div>`;
  openModalBg(); $("#dr_close").onclick=closeModal;
  try{
    const j=await driveCall({action:"list"}); const files=j.files||[];
    if(modalKind!=="drive") return;
    $("#dr_list").innerHTML = files.length ? `<div class="drv-list">${files.map(f=>`<div class="drv-item"><div><div style="font-weight:700">${esc(niceTime(f.time))}</div><div class="hint" style="margin:2px 0 0">${esc(f.name)} · ${esc(niceSize(f.size))}</div></div><button class="btn sm" data-drid="${esc(f.id)}" data-drt="${esc(niceTime(f.time))}">Restore</button></div>`).join("")}</div>
      ${j.folderUrl?`<p class="hint"><a href="${esc(j.folderUrl)}" target="_blank" rel="noopener">Open the backup folder in Google Drive</a></p>`:""}` : `<div class="empty">No backups yet.</div>`;
    document.querySelectorAll("[data-drid]").forEach(b=>b.onclick=async ()=>{
      if(!confirm("Replace ALL data (for everyone) with the backup from "+b.dataset.drt+"?\n\nA copy of the data as it is now is saved to Google Drive first, so this can be undone.")) return;
      b.disabled=true; b.innerHTML='<span class="spin"></span>Restoring…';
      try{
        const g=await driveCall({action:"get", id:b.dataset.drid}); const d=JSON.parse(g.data);
        if(!d.orders||!d.products) throw new Error("This is not a CoverLanka backup");
        await safetyBackup("before-restore");
        const key=DB.settings.claudeKey; d.settings=d.settings||{}; d.settings.claudeKey=key;
        closeModal(); uploadAll(d); toast("Restored the backup from "+b.dataset.drt);
      }catch(e){ b.disabled=false; b.textContent="Restore"; alert("Could not restore: "+e.message); }
    });
  }catch(e){ if($("#dr_list")) $("#dr_list").innerHTML=`<div class="alert" style="margin:0">${esc(e.message)}</div>`; }
}

/* ================= NOTIFICATIONS =================
   Standard Web Push (works on Android, iPhone home-screen app, and laptops), free.
   Each phone that turns notifications on is saved in the "devices" list.
   When an order is added, the phone that added it encrypts a short message for every
   other phone and the team's Google Apps Script passes it to Google / Apple / Mozilla. */
const b64u = {
  enc(buf){ const b=new Uint8Array(buf); let s=""; for(const x of b) s+=String.fromCharCode(x); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  std(buf){ const b=new Uint8Array(buf); let s=""; for(const x of b) s+=String.fromCharCode(x); return btoa(s); },
  dec(str){ str=String(str).replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const s=atob(str); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; }
};
const _te=new TextEncoder();
function _cat(...arrs){ const n=arrs.reduce((a,x)=>a+x.length,0), o=new Uint8Array(n); let p=0; arrs.forEach(x=>{ o.set(x,p); p+=x.length; }); return o; }
async function _hmac(key, data){ const k=await crypto.subtle.importKey("raw", key, {name:"HMAC",hash:"SHA-256"}, false, ["sign"]); return new Uint8Array(await crypto.subtle.sign("HMAC", k, data)); }

/* The team's VAPID key pair: made once by the first phone, kept in the protected database. */
async function getVapid(){
  if(CLOUD.vapid) return CLOUD.vapid;
  const F=window.FB, ref=F.doc(CLOUD.db,"meta","push");
  const v=await F.runTransaction(CLOUD.db, async t=>{
    const s=await t.get(ref);
    if(s.exists() && s.data().publicKey) return s.data();
    const kp=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"}, true, ["sign","verify"]);
    const pub=b64u.enc(await crypto.subtle.exportKey("raw", kp.publicKey));
    const jwk=await crypto.subtle.exportKey("jwk", kp.privateKey);
    const d={ publicKey:pub, privateJwk:JSON.stringify(jwk), created:new Date().toISOString() };
    t.set(ref, d); return d;
  });
  CLOUD.vapid=v; return v;
}
async function vapidHeader(endpoint, v){
  const aud=new URL(endpoint).origin;
  const head=b64u.enc(_te.encode(JSON.stringify({typ:"JWT",alg:"ES256"})));
  const body=b64u.enc(_te.encode(JSON.stringify({aud, exp:Math.floor(Date.now()/1000)+12*3600, sub:"mailto:"+((window.CL_CONFIG&&CL_CONFIG.teamEmail)||"team@coverlanka.lk")})));
  const key=await crypto.subtle.importKey("jwk", JSON.parse(v.privateJwk), {name:"ECDSA",namedCurve:"P-256"}, false, ["sign"]);
  const sig=await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"}, key, _te.encode(head+"."+body));
  return "vapid t="+head+"."+body+"."+b64u.enc(sig)+", k="+v.publicKey;
}
/* RFC 8291 message encryption (aes128gcm) */
async function encryptPush(sub, text){
  const uaPub=b64u.dec(sub.p256dh), auth=b64u.dec(sub.auth);
  const eph=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"}, true, ["deriveBits"]);
  const asPub=new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
  const uaKey=await crypto.subtle.importKey("raw", uaPub, {name:"ECDH",namedCurve:"P-256"}, false, []);
  const shared=new Uint8Array(await crypto.subtle.deriveBits({name:"ECDH",public:uaKey}, eph.privateKey, 256));
  const prkKey=await _hmac(auth, shared);
  const ikm=await _hmac(prkKey, _cat(_te.encode("WebPush: info\0"), uaPub, asPub, new Uint8Array([1])));
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const prk=await _hmac(salt, ikm);
  const cek=(await _hmac(prk, _cat(_te.encode("Content-Encoding: aes128gcm\0"), new Uint8Array([1])))).slice(0,16);
  const nonce=(await _hmac(prk, _cat(_te.encode("Content-Encoding: nonce\0"), new Uint8Array([1])))).slice(0,12);
  const key=await crypto.subtle.importKey("raw", cek, {name:"AES-GCM"}, false, ["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:nonce}, key, _cat(_te.encode(text), new Uint8Array([2]))));
  const hdr=new Uint8Array(21); hdr.set(salt,0); new DataView(hdr.buffer).setUint32(16,4096); hdr[20]=65;
  return _cat(hdr, asPub, ct);
}
function pushSupported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && window.isSecureContext; }
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }
function isStandalone(){ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }
function deviceName(){
  const ua=navigator.userAgent;
  if(/iPhone/.test(ua)) return "iPhone"; if(/iPad/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)) return "iPad";
  if(/Android/.test(ua)){ const m=ua.match(/Android[^;]*;\s*([^;)]+?)(?:\sBuild|\))/); return m&&m[1]&&!/^K$|wv/.test(m[1])?m[1].trim():"Android phone"; }
  if(/Windows/.test(ua)) return "Windows laptop"; if(/Mac/.test(ua)) return "Mac"; return "This device";
}
function myDeviceId(){ return localStorage.getItem("coverlanka_device")||""; }
async function currentSubscription(){
  if(!pushSupported()) return null;
  const reg=await navigator.serviceWorker.getRegistration(); if(!reg) return null;
  return reg.pushManager.getSubscription();
}
async function enableNotifications(name){
  if(!pushSupported()) throw new Error(isIOS()&&!isStandalone() ? "On iPhone, first add the app to the Home Screen (Share → Add to Home Screen), open it from there, then turn notifications on." : "This browser can't show notifications.");
  const perm=await Notification.requestPermission();
  if(perm!=="granted") throw new Error("Notifications are blocked. Allow them for this app in the phone's settings, then try again.");
  const reg=await navigator.serviceWorker.ready;
  const v=await getVapid();
  let sub=await reg.pushManager.getSubscription();
  if(sub){ const k=sub.options&&sub.options.applicationServerKey; if(k && b64u.enc(k)!==v.publicKey){ await sub.unsubscribe(); sub=null; } }
  if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64u.dec(v.publicKey) });
  const j=sub.toJSON();
  let id=myDeviceId(); const existing=(DB.devices||[]).find(d=>d.endpoint===j.endpoint);
  if(existing) id=existing.id; if(!id) id=uid();
  localStorage.setItem("coverlanka_device", id);
  const dev={ id, name:(name||deviceName()).slice(0,40), endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, added:new Date().toISOString() };
  DB.devices=(DB.devices||[]).filter(d=>d.id!==id && d.endpoint!==j.endpoint); DB.devices.push(dev); saveDB();
  return dev;
}
async function disableNotifications(){
  const sub=await currentSubscription(); const ep=sub&&sub.endpoint;
  if(sub) await sub.unsubscribe().catch(()=>{});
  const id=myDeviceId();
  DB.devices=(DB.devices||[]).filter(d=>d.id!==id && d.endpoint!==ep); saveDB();
}
/* send to every device (except this one unless includeSelf) */
async function sendPush(msg, includeSelf){
  if(!driveUrl()) throw new Error("The backup/notification service is not set up");
  const me=myDeviceId(), targets=(DB.devices||[]).filter(d=>includeSelf || d.id!==me);
  if(!targets.length) return {sent:0};
  const v=await getVapid(); const text=JSON.stringify(msg);
  const messages=await Promise.all(targets.map(async d=>({ id:d.id, endpoint:d.endpoint, body:b64u.std(await encryptPush(d,text)),
    headers:{ "Authorization":await vapidHeader(d.endpoint,v), "Content-Encoding":"aes128gcm", "TTL":"86400", "Urgency":"high" } })));
  const r=await driveCall({ action:"push", messages });
  const gone=[]; (r.results||[]).forEach((code,i)=>{ if(code===404||code===410) gone.push(messages[i].id); });
  if(gone.length){ DB.devices=(DB.devices||[]).filter(d=>!gone.includes(d.id)); saveDB(); }
  const ok=(r.results||[]).filter(c=>c>=200&&c<300).length;
  return { sent:ok, failed:(r.results||[]).length-ok, results:r.results };
}
function notifyNewOrder(o){
  if(DB.settings.notifyNewOrders===false || !(DB.devices||[]).length) return;
  const c=orderCalc(o), p=product(o.productId);
  const place=[o.city,o.district].filter(Boolean)[0]||"";
  sendPush({ title:"New order "+orderNo(o), body:[o.customer, c.qty+" × "+(p?p.name:"raincoat"), money(c.total), place].filter(Boolean).join(" · "), tag:"order-"+o.id, url:"./#orders" })
    .catch(e=>console.warn("Notification:", e.message));
}

/* ================= DOMEX COURIER =================
   Orders are sent to Domex, and parcel status is read back, through the
   Google Drive script — the Domex key and password live only there. */
const DOMEX_STATUS = { CI:"Waiting for pickup", I:"Received by Domex", SO:"Sent to sorting centre", SCCI:"At sorting centre", M:"On the way",
  A:"At delivery branch", ATD:"Out for delivery", RS:"Delivery rescheduled", CIU:"Details updated", CC:"Collected by Domex", D:"Delivered", PS:"Delivered", HI:"Held at branch", CD:"Removed from Domex" };
function domexSet(){ const S=DB.settings; S.domex=S.domex||{}; const d=S.domex;
  if(d.itemType==null) d.itemType=""; if(d.paymentMethod==null) d.paymentMethod="Cash"; if(d.isPaid==null) d.isPaid="No";
  if(d.autoSync==null) d.autoSync=true; return d; }
function domexOn(){ return !!driveUrl() && !!domexSet().ready; }
async function domexApi(op, extra){ return driveCall({ action:"domex", op, ...(extra||{}) }); }
function domexErr(res){ const d=res&&res.data; if(!d) return "Domex answered "+(res?res.status:"nothing");
  if(typeof d==="string") return d;
  if(d.errors) return Object.values(d.errors).flat().join(" "); return d.message||d.title||("Domex answered "+res.status); }
function domexParcel(o){
  const S=DB.settings, D=domexSet(), c=orderCalc(o), p=product(o.productId);
  const kg=Math.max(0.1, itemsWeight([{productId:o.productId,qty:c.qty}])||1);
  const due=new Date(Date.now()+7*864e5);
  const ph2=o.whatsapp && normPhone(o.whatsapp)!==normPhone(o.phone) ? o.whatsapp : o.phone;
  return { trackingNo:o.tracking, refNo:orderNo(o),
    paymentMethod:D.paymentMethod, isPaid:o.payment==="COD"?D.isPaid:"Yes", exchange:"No",
    beforeDelivered:due.toISOString(), itemType:D.itemType,
    senderName:D.senderName||S.businessName||"CoverLanka", senderAddress:D.senderAddress||S.address||"Matara", senderContactNo:String(D.senderPhone||S.phone||"").replace(/\s/g,"").slice(0,15),
    receiverName:o.customer, receiverAddress:o.address||o.city, receiverCity:o.city||o.district, receiverContactNo1:o.phone, receiverContactNo2:ph2,
    packageDesc:(p?p.name:"Raincoat")+" x "+c.qty, weight:kg, remark:"", createdUser:S.businessName||"CoverLanka", keyValue:0,
    totalCharges:Math.max(1, Math.round(c.total)),   // the full amount Domex collects (the API does not add a delivery fee)
    noOfPcs:1 };
}
function domexProblems(o){ const D=domexSet(), x=[];
  if(!o.tracking) x.push("Add the Domex tracking number (from the waybill sticker) first.");
  else if(!/^[A-Za-z0-9\-]{3,25}$/.test(o.tracking)) x.push("The tracking number looks wrong.");
  if(!o.address) x.push("Add the customer’s address."); if(!o.city && !o.district) x.push("Add the city.");
  if(!o.phone) x.push("Add the phone number.");
  if(!D.itemType) x.push("Domex item type is not set (Settings → Domex).");
  if(!(D.senderPhone||DB.settings.phone)) x.push("Add our phone number in Settings → Domex.");
  return x; }
async function sendToDomex(o, btn){
  const prob=domexProblems(o); if(prob.length){ alert("Can’t send "+orderNo(o)+" to Domex yet:\n\n• "+prob.join("\n• ")); return false; }
  const P=domexParcel(o);
  if(!confirm(`Send ${orderNo(o)} to Domex?\n\n${P.receiverName}\n${P.receiverAddress}, ${P.receiverCity}\n${P.receiverContactNo1}\n\nTracking no: ${P.trackingNo}\nDomex collects: ${money(P.totalCharges)}\nWeight: ${P.weight} kg`)) return false;
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>Sending…'; }
  try{
    const r=(await domexApi(o.domexSent?"update":"create",{ trackingNo:P.trackingNo, parcel:P })).result;
    const code=r.data&&r.data.errorCode;
    if(r.status===200 && (code==null||code===200)){ o.domexSent=new Date().toISOString(); toast(orderNo(o)+" sent to Domex");
      try{ const w=(await domexApi("waybill",{ trackingNo:P.trackingNo })).result;      // read back what Domex will collect
        if(w.status===200 && w.data && w.data.value!=null){ o.domexValue=num(w.data.value);
          const tot=Math.round(orderCalc(o).total);
          if(Math.round(o.domexValue)!==tot) setTimeout(()=>alert(`${orderNo(o)} is in Domex.\n\nDomex shows Rs. ${o.domexValue.toLocaleString("en-US")} for this parcel, but the order total in the app is ${money(tot)}. Check the amount in the Domex portal.`),300); } }catch(e){} }
    else if(code===218){ o.domexSent=o.domexSent||new Date().toISOString(); toast(orderNo(o)+" is already in Domex"); }
    else throw new Error(domexErr(r));
    if(["New","Confirmed"].includes(o.status)){ o.status="Dispatched"; o.dispatchedDate=today(); }
    saveDB(); render(); return true;
  }catch(e){ alert("Domex did not accept "+orderNo(o)+":\n\n"+e.message); if(btn){ btn.disabled=false; btn.textContent="Send to Domex"; } return false; }
}
function domexLatest(arr){ if(!Array.isArray(arr)||!arr.length) return null;
  return [...arr].sort((a,b)=>String(a.statusDate).localeCompare(String(b.statusDate))).pop(); }
function applyDomexStatus(o, arr){
  const last=domexLatest(arr); if(!last) return false;
  const code=String(last.statusCode||"").toUpperCase();
  const prev=o.domex&&o.domex.code;
  o.domex={ code, text:DOMEX_STATUS[code]||last.status||code, at:last.statusDate, checked:new Date().toISOString() };
  let changed = prev!==code;
  if((code==="D"||code==="PS") && o.status==="Dispatched"){ o.status="Delivered"; o.deliveredDate=String(last.statusDate||"").slice(0,10)||today(); changed=true; }
  else if(/return/i.test(String(last.status)) && o.status==="Dispatched"){ o.status="Returned"; changed=true; }
  return changed;
}
async function checkDomexOrder(o){
  const r=(await domexApi("status",{ trackingNo:o.tracking })).result;
  if(r.status===404) throw new Error("Domex has no record of "+o.tracking+" yet.");
  if(r.status!==200) throw new Error(domexErr(r));
  applyDomexStatus(o, r.data); saveDB(); return o.domex;
}
let _dxSync=false;
async function syncDomex(force){
  const D=domexSet();
  if(_dxSync||!domexOn()||!D.autoSync&&!force||!CLOUD.ready||!navigator.onLine||document.hidden&&!force) return;
  if(!force && D.lastSync && Date.now()-new Date(D.lastSync).getTime() < 2*3600e3) return;   // the team checks at most every 2 hours
  const list=DB.orders.filter(o=>o.status==="Dispatched" && o.tracking && /^[A-Za-z0-9\-]{3,25}$/.test(o.tracking)).slice(0,40);
  _dxSync=true;
  try{
    D.lastSync=new Date().toISOString(); saveDB();
    if(!list.length) return 0;
    const res=(await domexApi("statusMany",{ trackingNos:list.map(o=>o.tracking) })).results||{};
    let n=0, delivered=[];
    list.forEach(o=>{ const r=res[o.tracking]; if(r&&r.status===200){ const was=o.status; if(applyDomexStatus(o,r.data)) n++; if(was!==o.status && o.status==="Delivered") delivered.push(o); } });
    if(n){ saveDB(); render(); }
    if(delivered.length) toast(delivered.length===1?orderNo(delivered[0])+" was delivered":delivered.length+" parcels were delivered");
    return n;
  }catch(e){ console.warn("Domex sync:", e.message); if(force) throw e; }
  finally{ _dxSync=false; }
}

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
function esc(v){ return String(v ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ const n = parseFloat(v); return isNaN(n)?0:n; }
function money(n){ n = Math.round(Number(n)||0); return (n<0?"-":"")+"Rs. "+Math.abs(n).toLocaleString("en-US"); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.remove("act"); t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function toastUndo(msg, fn){

/* ================= TRASH =================
   Nothing is deleted straight away: it goes to the Trash (shared with the team)
   and can be brought back for 30 days. */
const TRASH_DAYS=30;
const TRASH_KIND={orders:"Order",quotes:"Quotation",restocks:"Stock entry",expenses:"Expense",partners:"Partner",products:"Product"};
function trashLabel(col,it){
  if(col==="orders") return orderNo(it)+" — "+(it.customer||"");
  if(col==="quotes") return quoteNo(it)+" — "+(it.customer||"");
  if(col==="restocks"){ const p=product(it.productId); return (it.qty||0)+" × "+(p?p.name:"item")+" ("+(it.date||"")+")"; }
  if(col==="expenses") return (it.description||it.category||"Expense")+" — "+money(it.amount);
  return it.name||"";
}
function moveToTrash(col,id){
  const it=(DB[col]||[]).find(x=>x.id===id); if(!it) return null;
  DB[col]=DB[col].filter(x=>x.id!==id);
  const t={ id:uid(), col, item:JSON.parse(JSON.stringify(it)), label:trashLabel(col,it), deletedAt:Date.now(), by:CLOUD.user?CLOUD.user.email:"" };
  (DB.trash=DB.trash||[]).push(t); saveDB(); return t;
}
function restoreFromTrash(tid){
  const t=(DB.trash||[]).find(x=>x.id===tid); if(!t) return false;
  const arr=DB[t.col]||(DB[t.col]=[]); if(!arr.some(x=>x.id===t.item.id)) arr.push(t.item);
  DB.trash=DB.trash.filter(x=>x.id!==tid); saveDB(); return true;
}
/* delete with an Undo button on the message */
function trashIt(col,id,after){
  const t=moveToTrash(col,id); if(after) after(); render();
  if(t) toastUndo(TRASH_KIND[col]+" moved to Trash", ()=>{ restoreFromTrash(t.id); toast("Brought back"); render(); });
}
function purgeTrash(){
  const cut=Date.now()-TRASH_DAYS*864e5, before=(DB.trash||[]).length;
  DB.trash=(DB.trash||[]).filter(t=>num(t.deletedAt)>=cut);
  if(DB.trash.length!==before) saveDB();
}
function product(id){ return DB.products.find(p=>p.id===id); }
function orderNo(o){ return "CL-"+String(o.no).padStart(4,"0"); }
function monthName(ym){ if(!ym) return "All time"; const [y,m]=ym.split("-"); return new Date(+y,+m-1,1).toLocaleString("en-US",{month:"long",year:"numeric"}); }
function normPhone(p){ let d=String(p||"").replace(/\D/g,""); if(d.startsWith("94")&&d.length===11) d="0"+d.slice(2); if(d.length===9&&d[0]==="7") d="0"+d; return d; }

function orderCalc(o){
  const qty = num(o.qty)||1;
  const p = product(o.productId);
  const unitCost = o.unitCost!=null ? num(o.unitCost) : (p?num(p.cost):0);
  const subtotal = num(o.price)*qty;
  const total = subtotal - num(o.discount) + num(o.delivery);
  const productCost = unitCost*qty;
  let profit;
  if(o.status==="Cancelled") profit = 0;
  else if(o.status==="Returned") profit = -num(o.courierCost);
  else profit = total - productCost - num(o.courierCost);
  return { qty, subtotal, total, productCost, profit };
}
/* Prices, bulk discount and weight-based delivery */
function pricing(){ return DB.settings.pricing || { firstKg:425, extraKg:150, courierFirstKg:425, courierExtraKg:150, tiers:[] }; }
function itemsWeight(items){ return items.reduce((a,it)=>{ const p=it.productId?product(it.productId):null; return a+(p?num(p.weightKg==null?1:p.weightKg):0)*num(it.qty); },0); }
function byWeight(kg, first, extra){ if(kg<=0) return 0; return num(first)+num(extra)*(Math.ceil(kg-1e-9)-1); }
function deliveryCharge(kg){ const P=pricing(); return byWeight(kg,P.firstKg,P.extraKg); }
function courierCharge(kg){ const P=pricing(); return byWeight(kg,P.courierFirstKg,P.courierExtraKg); }
function bulkOffPerUnit(qty){ const t=[...(pricing().tiers||[])].filter(t=>num(t.min)>0).sort((a,b)=>num(b.min)-num(a.min)).find(t=>qty>=num(t.min)); return t?num(t.off):0; }
function countsTowardStock(o){ return o.status!=="Cancelled" && o.status!=="Returned"; }
function stockOf(p){
  const stockIn = DB.restocks.filter(r=>r.productId===p.id).reduce((a,r)=>a+num(r.qty),0);
  const sold = DB.orders.filter(o=>o.productId===p.id && countsTowardStock(o)).reduce((a,o)=>a+(num(o.qty)||1),0);
  const available = stockIn - sold;
  const status = available<=0 ? "Out of stock" : (available<=num(p.reorder) ? "Low stock" : "OK");
  return { stockIn, sold, available, status };
}
function stockClass(s){ return s==="OK"?"ok":(s==="Low stock"?"low":"out"); }

/* Money picture for the whole business (all time) */
function businessMoney(){
  const capital = (DB.partners||[]).reduce((a,p)=>a+num(p.amount),0);
  const stockBought = DB.restocks.reduce((a,r)=>a+num(r.amountPaid),0);
  const expenses = DB.expenses.reduce((a,e)=>a+num(e.amount),0);
  const delivered = DB.orders.filter(o=>o.status==="Delivered");
  const returned = DB.orders.filter(o=>o.status==="Returned");
  const sales = delivered.reduce((a,o)=>a+orderCalc(o).total,0);
  const courier = [...delivered,...returned].reduce((a,o)=>a+num(o.courierCost),0);
  const pcost = delivered.reduce((a,o)=>a+orderCalc(o).productCost,0);
  const cash = capital - stockBought - expenses - courier + sales;
  const stockValue = DB.products.reduce((a,p)=>a+Math.max(0,stockOf(p).available)*num(p.cost),0);
  const worth = cash + stockValue;
  const netProfit = sales - pcost - courier - expenses;
  return { capital, stockBought, expenses, sales, courier, pcost, cash, stockValue, worth, netProfit };
}

/* Customers are built from the orders (one per phone number) */
function customers(){
  const map = new Map();
  [...DB.orders].sort((a,b)=>a.no-b.no).forEach(o=>{
    const key = normPhone(o.phone) || ("name:"+(o.customer||"").toLowerCase());
    let c = map.get(key);
    if(!c){ c={ key, phone:o.phone, name:o.customer, address:o.address, city:o.city, district:o.district, orders:0, delivered:0, returned:0, cancelled:0, spent:0, first:o.date, last:o.date }; map.set(key,c); }
    c.whatsapp=o.whatsapp||c.whatsapp; c.name=o.customer||c.name; c.address=o.address||c.address; c.city=o.city||c.city; c.district=o.district||c.district; c.phone=o.phone||c.phone;
    c.orders++; if(o.status==="Delivered"){ c.delivered++; c.spent+=orderCalc(o).total; }
    if(o.status==="Returned") c.returned++; if(o.status==="Cancelled") c.cancelled++;
    if((o.date||"")>(c.last||"")) c.last=o.date;
  });
  return [...map.values()];
}
function findCustomerByPhone(phone){ const k=normPhone(phone); if(k.length<9) return null; return customers().find(c=>c.key===k || normPhone(c.whatsapp)===k)||null; }

/* ================= REMINDERS ================= */
function daysSince(d){ if(!d) return 0; return Math.floor((new Date(today()) - new Date(d)) / 86400000); }
function reminders(){
  const nd=num(DB.settings.remindNewDays)||2, dd=num(DB.settings.remindDispatchDays)||5;
  const list=[];
  DB.orders.forEach(o=>{
    if((o.status==="New"||o.status==="Confirmed") && daysSince(o.date)>=nd) list.push({o, why:`${o.status} for ${daysSince(o.date)} days — not dispatched yet`});
    if(o.status==="Dispatched" && daysSince(o.dispatchedDate||o.date)>=dd) list.push({o, why:`Dispatched ${daysSince(o.dispatchedDate||o.date)} days ago — not marked delivered`});
  });
  return list.sort((a,b)=>a.o.no-b.o.no);
}
function stockRunway(){
  const since = new Date(new Date(today()).getTime()-14*86400000).toISOString().slice(0,10);
  const sold14 = DB.orders.filter(o=>countsTowardStock(o) && (o.date||"")>=since).reduce((a,o)=>a+(num(o.qty)||1),0);
  const avail = DB.products.filter(p=>p.active!==false).reduce((a,p)=>a+stockOf(p).available,0);
  if(!sold14) return { perDay:0, days:null, avail };
  const perDay = sold14/14; return { perDay, days: Math.floor(avail/perDay), avail };
}
